<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bahnsim 2D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e2d4;
  display: flex; align-items: center; justify-content: center;
  height: 100vh; overflow: hidden;
  font-family: 'Georgia', serif;
}
canvas { display: block; }
#hud {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 28px;
  color: #444; font-size: 12px; letter-spacing: 0.08em;
  opacity: 0.7; pointer-events: none; user-select: none;
  font-style: italic;
}
#hud span { border-bottom: 1px solid #888; padding-bottom: 1px; }
#keys {
  position: fixed; top: 12px; right: 16px;
  color: #888; font-size: 10px; text-align: right;
  line-height: 1.8; pointer-events: none; font-style: italic;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="h-speed">0 km/h</span>
  <span id="h-station">→ Hauptbahnhof</span>
  <span id="h-pax">0 Fahrgäste</span>
</div>
<div id="keys">← → fahren / bremsen</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Paper texture offscreen
const paperCanvas = document.createElement('canvas');
const paperCtx = paperCanvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  buildPaper();
}

function buildPaper() {
  paperCanvas.width = canvas.width;
  paperCanvas.height = canvas.height;
  // Base cream
  paperCtx.fillStyle = '#ece7da';
  paperCtx.fillRect(0, 0, paperCanvas.width, paperCanvas.height);
  // Grain
  const id = paperCtx.getImageData(0, 0, paperCanvas.width, paperCanvas.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n * 0.9));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n * 0.7));
  }
  paperCtx.putImageData(id, 0, 0);
  // Horizontal fiber lines
  paperCtx.save();
  for (let y = 0; y < paperCanvas.height; y += 3 + Math.random() * 4) {
    paperCtx.globalAlpha = Math.random() * 0.03;
    paperCtx.strokeStyle = '#b0a080';
    paperCtx.lineWidth = 0.4;
    paperCtx.beginPath();
    paperCtx.moveTo(0, y);
    paperCtx.lineTo(paperCanvas.width, y + (Math.random()-0.5)*2);
    paperCtx.stroke();
  }
  paperCtx.restore();
}

resize();
window.addEventListener('resize', resize);

// Pencil stroke color — pure graphite
const INK = '#2c2820';
const INK_LIGHT = '#5a5248';
const INK_FAINT = '#8a8278';

// Noise
function rnd(n) { return (Math.random() - 0.5) * n; }

// Draw a wobbly pencil line — breaks into short segments with jitter
function pline(x1, y1, x2, y2, alpha=0.65, lw=1, segs=3) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = lw;
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1 + rnd(0.8), y1 + rnd(0.8));
  for (let s = 1; s <= segs; s++) {
    const t = s / segs;
    const mx = x1 + (x2 - x1) * t + rnd(1.2);
    const my = y1 + (y2 - y1) * t + rnd(1.2);
    ctx.lineTo(mx, my);
  }
  ctx.stroke();
  // Second ghost pass for pencil feel
  ctx.globalAlpha = alpha * 0.18;
  ctx.lineWidth = lw * 2.2;
  ctx.beginPath();
  ctx.moveTo(x1 + rnd(1), y1 + rnd(1));
  ctx.lineTo(x2 + rnd(1), y2 + rnd(1));
  ctx.stroke();
  ctx.restore();
}

// Sketch rect with wobbly corners
function pRect(x, y, w, h, alpha=0.65, lw=1) {
  pline(x, y, x+w, y, alpha, lw);
  pline(x+w, y, x+w, y+h, alpha, lw);
  pline(x+w, y+h, x, y+h, alpha, lw);
  pline(x, y+h, x, y, alpha, lw);
}

// Hatching for shadow/fill
function hatch(x, y, w, h, alpha=0.12, spacing=5, angle=45) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 0.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const rad = angle * Math.PI / 180;
  const diagLen = Math.sqrt(w*w + h*h) * 1.5;
  const step = spacing;
  for (let d = -diagLen; d < diagLen; d += step) {
    const cx2 = x + w/2, cy2 = y + h/2;
    const ax = cx2 + d * Math.cos(rad + Math.PI/2) - diagLen * Math.cos(rad);
    const ay = cy2 + d * Math.sin(rad + Math.PI/2) - diagLen * Math.sin(rad);
    const bx = cx2 + d * Math.cos(rad + Math.PI/2) + diagLen * Math.cos(rad);
    const by = cy2 + d * Math.sin(rad + Math.PI/2) + diagLen * Math.sin(rad);
    // Clip to rect
    const pts = clipLineToRect(ax, ay, bx, by, x, y, x+w, y+h);
    if (pts) {
      ctx.moveTo(pts[0] + rnd(0.4), pts[1] + rnd(0.4));
      ctx.lineTo(pts[2] + rnd(0.4), pts[3] + rnd(0.4));
    }
  }
  ctx.stroke();
  ctx.restore();
}

function clipLineToRect(ax, ay, bx, by, x0, y0, x1, y1) {
  // Cohen-Sutherland simplified
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dy = by - ay;
  const tests = [
    [-dx, ax - x0], [dx, x1 - ax],
    [-dy, ay - y0], [dy, y1 - ay]
  ];
  for (const [p, q] of tests) {
    if (p === 0) { if (q < 0) return null; continue; }
    const r = q / p;
    if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
    else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [ax + t0*dx, ay + t0*dy, ax + t1*dx, ay + t1*dy];
}

// ---- World ----
const GROUND_Y = () => canvas.height * 0.70;
let worldX = 0, tramX = 0, speed = 0;
const maxSpeed = 200, accel = 55, brake = 115;
let autobrake = false, doorsOpen = false, doorTimer = 0, boardingTimer = 0, pax = 0;

const stationNames = [
  'Hauptbahnhof','Marktplatz','Rathaus','Stadtpark','Universität',
  'Westbahnhof','Schillerplatz','Goethestraße','Moritzbastei','Am Teich',
  'Kirschblütenweg','Waldfriedhof','Industriestr.','Neugasse','Südring',
  'Botanischer Garten','Fischmarkt','Lindenallee','Nordbahnhof','Alte Mühle',
  'Dampfbad','Kupferhammer','Silbersee','Bergstation','Talblick'
];

const stations = [];
let sx2 = 400;
for (let i = 0; i < 200; i++) {
  sx2 += 880 + Math.random() * 650;
  stations.push({ x: sx2, name: stationNames[i % stationNames.length],
    waiting: Math.floor(Math.random()*6)+1, served: false });
}
let nextStationIdx = 0, stoppedAt = null;

// Background elements — pre-seeded
const bgElems = [];
for (let i = 0; i < 700; i++) {
  const wx = Math.random() * 200000;
  const r = Math.random();
  if (r < 0.28) bgElems.push({ type:'tree',    wx, layer:2, h: 45+Math.random()*55 });
  else if (r < 0.50) bgElems.push({ type:'pine',wx, layer:2, h: 55+Math.random()*65 });
  else if (r < 0.67) bgElems.push({ type:'house',wx, layer:2, w:55+Math.random()*45, h:40+Math.random()*35 });
  else if (r < 0.80) bgElems.push({ type:'tree', wx, layer:3, h: 22+Math.random()*28 });
  else if (r < 0.90) bgElems.push({ type:'pine', wx, layer:3, h: 18+Math.random()*22 });
  else bgElems.push({ type:'hill', wx, layer:1, w:280+Math.random()*420, h:55+Math.random()*90 });
}
bgElems.sort((a,b)=>a.layer-b.layer);

const birds = Array.from({length:10}, () => ({
  wx: Math.random()*8000, wy: 50+Math.random()*100,
  spd: 25+Math.random()*55, flap: Math.random()*Math.PI*2
}));

// Input
const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code]=false; });

// Loop
let last = 0;
function loop(ts) {
  const dt = Math.min((ts-last)/1000, 0.05); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  while (nextStationIdx < stations.length-1 && stations[nextStationIdx].served) nextStationIdx++;
  const ns = stations[nextStationIdx];
  const dist = ns.x - tramX;
  const brakeDist = (speed*speed)/(2*brake)+35;
  autobrake = dist < brakeDist+20 && dist > -10 && !stoppedAt;

  if (dist <= 0 && !stoppedAt && speed < 5) {
    speed = 0; stoppedAt = ns; doorsOpen = false; doorTimer = 0.5; boardingTimer = 2.8;
  }
  if (stoppedAt) {
    doorTimer -= dt;
    if (doorTimer <= 0 && !doorsOpen) doorsOpen = true;
    if (doorsOpen) {
      boardingTimer -= dt;
      if (boardingTimer <= 0) {
        pax = Math.max(0, pax - Math.floor(Math.random()*3+1));
        pax = Math.min(8, pax + Math.min(stoppedAt.waiting, 8-pax));
        stoppedAt.waiting = 0; stoppedAt.served = true;
        stoppedAt = null; doorsOpen = false;
      }
    }
  }
  if (!stoppedAt) {
    if ((keys['ArrowRight']||keys['KeyD']) && !autobrake) speed = Math.min(maxSpeed, speed+accel*dt);
    else if (keys['ArrowLeft']||keys['KeyA']) speed = Math.max(0, speed-brake*dt);
    else if (autobrake) speed = Math.max(0, speed-brake*dt);
    else speed = Math.min(maxSpeed*0.5, speed+accel*0.25*dt);
  }
  tramX += speed*dt;
  worldX = tramX - canvas.width*0.34;

  for (const b of birds) {
    b.wx += b.spd*dt; b.flap += dt*3.5;
    if (b.wx - worldX*0.1 > canvas.width+200) b.wx -= 14000;
  }

  const kmh = Math.round(speed*3.6/10)*10;
  document.getElementById('h-speed').textContent = kmh+' km/h';
  document.getElementById('h-station').textContent = '→ '+ns.name+(dist<200?' ·':'');
  document.getElementById('h-pax').textContent = pax+' Fahrgäste';
}

function draw() {
  const W = canvas.width, H = canvas.height, GY = GROUND_Y();

  // Paper base
  ctx.drawImage(paperCanvas, 0, 0);

  // Sky — very faint gray wash, just slightly lighter than paper at top
  ctx.save();
  ctx.globalAlpha = 0.18;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GY);
  skyGrad.addColorStop(0, '#d0ccc0');
  skyGrad.addColorStop(1, '#e8e4d8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GY);
  ctx.restore();

  // Far hills — very faint, light hatching
  for (const o of bgElems) {
    if (o.layer !== 1) continue;
    const sx = o.wx - worldX * 0.06;
    if (sx < -500 || sx > W+500) continue;
    drawHill(sx, GY - 20, o.w, o.h, 0.10);
  }

  // Mid layer
  for (const o of bgElems) {
    if (o.layer !== 2) continue;
    const sx = o.wx - worldX * 0.28;
    if (sx < -200 || sx > W+200) continue;
    const groundBase = GY - 10;
    ctx.save(); ctx.globalAlpha = 0.55;
    if (o.type==='tree')  drawTree(sx, groundBase, o.h, 0.28);
    if (o.type==='pine')  drawPine(sx, groundBase, o.h, 0.28);
    if (o.type==='house') drawHouse(sx, groundBase, o.w, o.h);
    ctx.restore();
  }

  // Near layer
  for (const o of bgElems) {
    if (o.layer !== 3) continue;
    const sx = o.wx - worldX * 0.72;
    if (sx < -100 || sx > W+100) continue;
    ctx.save(); ctx.globalAlpha = 0.8;
    if (o.type==='tree') drawTree(sx, GY+2, o.h, 0.72);
    if (o.type==='pine') drawPine(sx, GY+2, o.h, 0.72);
    ctx.restore();
  }

  // Birds
  for (const b of birds) {
    const bsx = b.wx - worldX*0.1;
    if (bsx < -30 || bsx > W+30) continue;
    ctx.save(); ctx.globalAlpha = 0.35;
    ctx.strokeStyle = INK; ctx.lineWidth = 0.8; ctx.lineCap='round';
    const flap = Math.sin(b.flap)*5;
    ctx.beginPath();
    ctx.moveTo(bsx-9, b.wy+flap);
    ctx.quadraticCurveTo(bsx-4, b.wy, bsx, b.wy+2);
    ctx.quadraticCurveTo(bsx+4, b.wy, bsx+9, b.wy+flap);
    ctx.stroke();
    ctx.restore();
  }

  // Ground — hatched / textured
  ctx.save();
  ctx.globalAlpha = 0.06;
  const gGrad = ctx.createLinearGradient(0, GY, 0, H);
  gGrad.addColorStop(0, '#888');
  gGrad.addColorStop(1, '#555');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, GY, W, H-GY);
  ctx.restore();
  hatch(0, GY, W, H-GY, 0.055, 8, 30);
  // Ground horizon line — strong pencil stroke
  pline(0, GY, W, GY, 0.55, 1.5, 8);

  // Grass tufts along ground
  const tSpacing = 40;
  const tOffset = worldX % tSpacing;
  for (let tx = -tOffset; tx < W + tSpacing; tx += tSpacing) {
    const gx = tx + rnd(4);
    for (let blade = 0; blade < 3; blade++) {
      const bx = gx + rnd(6);
      pline(bx, GY, bx + rnd(4)-1, GY - 5 - Math.random()*5, 0.2, 0.5, 2);
    }
  }

  // Track
  drawTrack(GY);

  // Overhead wire + poles
  drawOverhead(GY);

  // Stations
  for (const s of stations) {
    const sx = s.x - worldX;
    if (sx < -200 || sx > W+200) continue;
    drawStation(s, GY);
  }

  // Tram
  drawTram(tramX - worldX, GY);

  // Vignette — soft pencil smudge at edges
  ctx.save();
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(30,25,18,0.28)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawHill(x, groundY, w, h, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = INK_FAINT; ctx.lineWidth = 0.8; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x - w/2 + rnd(3), groundY + rnd(2));
  ctx.bezierCurveTo(
    x - w*0.2 + rnd(10), groundY - h*0.6 + rnd(8),
    x + w*0.2 + rnd(10), groundY - h + rnd(10),
    x + w/2 + rnd(3), groundY + rnd(2)
  );
  ctx.stroke();
  // faint interior hatch
  hatch(x - w/2, groundY - h, w, h, 0.04, 14, 25);
  ctx.restore();
}

function drawTree(x, groundY, h, par) {
  const lw = par > 0.5 ? 1 : 0.6;
  const trunkH = h * 0.38;
  // trunk — double line
  pline(x-2, groundY, x-1, groundY-trunkH, 0.7, lw);
  pline(x+2, groundY, x+1, groundY-trunkH, 0.65, lw*0.8);
  // canopy outline — wobbly ellipse
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = lw;
  const cy = groundY - trunkH - h*0.32;
  const rx = h*0.32, ry = h*0.34;
  // draw as poly of short lines
  ctx.beginPath();
  const steps = 18;
  for (let i = 0; i <= steps; i++) {
    const a = (i/steps)*Math.PI*2;
    const px2 = x + Math.cos(a)*rx + rnd(1.8);
    const py = cy + Math.sin(a)*ry + rnd(1.8);
    i===0 ? ctx.moveTo(px2,py) : ctx.lineTo(px2,py);
  }
  ctx.globalAlpha = 0.65; ctx.stroke();
  // inner scribble
  for (let s=0; s<5; s++) {
    ctx.globalAlpha = 0.12;
    ctx.beginPath();
    ctx.moveTo(x+rnd(rx*0.8), cy+rnd(ry*0.8));
    ctx.lineTo(x+rnd(rx*0.8), cy+rnd(ry*0.8));
    ctx.stroke();
  }
  ctx.restore();
}

function drawPine(x, groundY, h, par) {
  const lw = par > 0.5 ? 1 : 0.6;
  pline(x, groundY, x, groundY-h, 0.7, lw);
  const layers = 5;
  for (let i = 0; i < layers; i++) {
    const t = i/layers;
    const ly = groundY - h*(0.12 + t*0.82);
    const lw2 = h*(0.28 - t*0.18);
    pline(x-lw2+rnd(1), ly+h*0.04+rnd(1), x+rnd(2), ly-h*0.10+rnd(2), 0.6, lw, 2);
    pline(x+lw2+rnd(1), ly+h*0.04+rnd(1), x+rnd(2), ly-h*0.10+rnd(2), 0.6, lw, 2);
  }
}

function drawHouse(x, groundY, w, h) {
  // wall — hatched fill first
  hatch(x-w/2, groundY-h, w, h, 0.07, 7, 90);
  pRect(x-w/2, groundY-h, w, h, 0.65, 1);
  // roof
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth=1.2; ctx.globalAlpha=0.65; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-w/2-5+rnd(1), groundY-h+rnd(1));
  ctx.lineTo(x+rnd(2), groundY-h-h*0.55+rnd(3));
  ctx.lineTo(x+w/2+5+rnd(1), groundY-h+rnd(1));
  ctx.stroke();
  // roof hatch
  hatch(x-w/2-5, groundY-h-h*0.55, w+10, h*0.55, 0.08, 5, 135);
  ctx.restore();
  // windows
  const winCount = Math.floor(w/25);
  for (let i=0; i<winCount; i++) {
    const wx2 = x - w/2 + 12 + i*(w-16)/(Math.max(winCount-1,1));
    pRect(wx2-6+rnd(0.5), groundY-h*0.62+rnd(0.5), 12, 10, 0.55, 0.8);
    // cross
    pline(wx2, groundY-h*0.62, wx2, groundY-h*0.62+10, 0.3, 0.5);
    pline(wx2-6, groundY-h*0.62+5, wx2+6, groundY-h*0.62+5, 0.3, 0.5);
  }
  // door
  pRect(x-5+rnd(0.5), groundY-h*0.4+rnd(0.5), 10, h*0.4, 0.5, 0.8);
}

function drawTrack(GY) {
  const W = canvas.width;
  const railY = GY + 3;
  const gauge = 13;

  // Sleepers first
  const sleeperSpacing = 20;
  const off = worldX % sleeperSpacing;
  for (let tx = -off; tx < W + sleeperSpacing; tx += sleeperSpacing) {
    pline(tx+rnd(0.4), railY-gauge-1, tx+rnd(0.4), railY+gauge+1, 0.35, 2.5, 1);
  }
  // Rails
  pline(-5, railY-gauge/2, W+5, railY-gauge/2, 0.7, 1.4, 12);
  pline(-5, railY+gauge/2, W+5, railY+gauge/2, 0.7, 1.4, 12);
}

function drawOverhead(GY) {
  const W = canvas.width;
  const wireY = GY - 88;
  const poleSpacing = 175;
  const off = worldX % poleSpacing;

  // Poles
  for (let px = -off; px < W+poleSpacing; px += poleSpacing) {
    pline(px+rnd(0.5), GY+3, px+rnd(0.5), wireY+2, 0.45, 1.2);
    // cross arm
    pline(px, wireY+2, px-20, wireY-6, 0.38, 0.9);
    pline(px-20, wireY-6, px-20, wireY+4, 0.3, 0.7);
    // brace
    pline(px-20, wireY-6, px-8, wireY-12, 0.25, 0.6);
  }

  // Catenary wire
  ctx.save(); ctx.strokeStyle = INK_LIGHT; ctx.lineWidth = 0.7;
  ctx.globalAlpha = 0.38; ctx.lineCap='round';
  ctx.beginPath();
  for (let px = -off; px < W+poleSpacing; px += poleSpacing) {
    ctx.moveTo(px+rnd(0.5), wireY+rnd(0.5));
    ctx.quadraticCurveTo(px+poleSpacing/2+rnd(3), wireY+8+rnd(1),
                         px+poleSpacing+rnd(0.5), wireY+rnd(0.5));
  }
  ctx.stroke();
  ctx.restore();
}

function drawStation(station, GY) {
  const sx = station.x - worldX;
  const ph = 7, pw = 95;

  // Platform — hatched stone look
  hatch(sx-pw/2, GY-ph, pw, ph, 0.1, 4, 0);
  pRect(sx-pw/2, GY-ph, pw, ph, 0.6, 1.2);

  // Shelter frame
  const sh = 38, sw = 52;
  const roofY = GY - ph - sh;
  pline(sx-sw/2, GY-ph, sx-sw/2, roofY, 0.58, 1);
  pline(sx+sw/2, GY-ph, sx+sw/2, roofY, 0.58, 1);
  // Roof beam
  pline(sx-sw/2-6, roofY, sx+sw/2+6, roofY, 0.62, 1.5);
  // Roof slope
  pline(sx-sw/2-6, roofY, sx-sw/2-14, roofY-9, 0.5, 1);
  pline(sx+sw/2+6, roofY, sx+sw/2+14, roofY-9, 0.5, 1);
  pline(sx-sw/2-14, roofY-9, sx+sw/2+14, roofY-9, 0.4, 0.8);
  // Roof hatch
  hatch(sx-sw/2-14, roofY-9, sw+28, 9, 0.08, 4, 135);
  // Back wall faint
  pRect(sx-sw/2, roofY, sw, sh*0.6, 0.15, 0.6);

  // Name sign
  ctx.save();
  ctx.font = `italic ${Math.max(8,9)}px Georgia`;
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.65;
  ctx.textAlign = 'center';
  ctx.fillText(station.name, sx, roofY-14);
  ctx.restore();

  // Waiting people
  for (let i=0; i<station.waiting; i++) {
    drawPerson(sx - 38 + i*11 + rnd(2), GY-ph, false);
  }
}

function drawPerson(x, y, onboard) {
  const h = onboard ? 15 : 20;
  const alpha = onboard ? 0.55 : 0.62;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = INK; ctx.lineCap='round';
  // head
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(x+rnd(0.5), y-h+rnd(0.5), 3, 0, Math.PI*2);
  ctx.stroke();
  // body
  pline(x, y-h+3.5, x+rnd(1), y-h*0.38, alpha, 0.9, 2);
  // arms
  pline(x-4, y-h*0.58, x+4, y-h*0.58+rnd(1), alpha, 0.8, 1);
  // legs
  pline(x, y-h*0.38, x-3+rnd(1), y, alpha, 0.9, 2);
  pline(x, y-h*0.38, x+3+rnd(1), y, alpha, 0.9, 2);
  ctx.restore();
}

function drawTram(x, GY) {
  const TW = 132, TH = 54;
  const ty = GY - TH + 3;

  ctx.save();

  // Shadow — soft hatch under tram
  hatch(x-TW/2+5, GY+2, TW-10, 6, 0.07, 4, 0);

  // Body — paper fill with hatch shading
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#ccc';
  ctx.fillRect(x-TW/2, ty, TW, TH);
  ctx.restore();
  hatch(x-TW/2, ty, TW, TH, 0.04, 9, 90);
  // Shadow side (right side darker)
  hatch(x+TW/2-20, ty, 20, TH, 0.06, 5, 90);

  // Outline
  pRect(x-TW/2, ty, TW, TH, 0.82, 1.8);

  // Roof line
  pline(x-TW/2+3, ty+6, x+TW/2-3, ty+6, 0.35, 0.7, 6);

  // Side stripe
  pline(x-TW/2, ty+TH*0.55, x+TW/2, ty+TH*0.55, 0.25, 0.6, 8);

  // Windows — 6
  const winW=15, winH=19;
  const winY = ty+8;
  const winStep = (TW-24)/5;
  for (let i=0; i<6; i++) {
    const wx2 = x - TW/2 + 12 + i*winStep;
    // window fill — very faint
    ctx.save(); ctx.globalAlpha=0.08; ctx.fillStyle='#aaccdd';
    ctx.fillRect(wx2-winW/2, winY, winW, winH); ctx.restore();
    // arch
    ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=0.9; ctx.globalAlpha=0.75; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(wx2-winW/2+rnd(0.5), winY+winH+rnd(0.5));
    ctx.lineTo(wx2-winW/2+rnd(0.5), winY+5+rnd(0.5));
    ctx.arc(wx2+rnd(0.4), winY+5, winW/2, Math.PI, 0);
    ctx.lineTo(wx2+winW/2+rnd(0.5), winY+winH+rnd(0.5));
    ctx.stroke();
    ctx.restore();
    // horizontal sill
    pline(wx2-winW/2-1, winY+winH, wx2+winW/2+1, winY+winH, 0.45, 0.8);
    // passenger
    if (i>0 && i<5 && i<=pax) drawPerson(wx2, winY+winH-1, true);
  }

  // Door
  const doorX = x - TW/2 + 26;
  if (doorsOpen) {
    // open door — gap
    pline(doorX, ty+TH*0.22, doorX-9, ty+TH*0.22, 0.6, 1);
    pline(doorX+13, ty+TH*0.22, doorX+22, ty+TH*0.22, 0.6, 1);
    pline(doorX, ty+TH*0.22, doorX, ty+TH, 0.25, 0.6);
  } else {
    pRect(doorX, ty+TH*0.22, 13, TH*0.78, 0.65, 0.9);
    pline(doorX+6.5, ty+TH*0.22, doorX+6.5, ty+TH, 0.3, 0.6);
  }

  // Bumpers
  pline(x-TW/2, ty+TH*0.58, x-TW/2-10, ty+TH*0.70, 0.7, 2);
  pline(x+TW/2, ty+TH*0.58, x+TW/2+10, ty+TH*0.70, 0.7, 2);
  pline(x-TW/2-10, ty+TH*0.65, x-TW/2-10, ty+TH*0.78, 0.5, 1.5);
  pline(x+TW/2+10, ty+TH*0.65, x+TW/2+10, ty+TH*0.78, 0.5, 1.5);

  // Pantograph
  const pantX = x+22;
  const ptBaseY = ty, ptMidY = ty-22;
  const wireY2 = GY-88;
  pline(pantX-14, ptBaseY, pantX-4, ptMidY+6, 0.65, 1);
  pline(pantX+14, ptBaseY, pantX+4, ptMidY+6, 0.65, 1);
  pline(pantX-4, ptMidY+6, pantX+4, ptMidY+6, 0.72, 1.3);
  pline(pantX, ptMidY+6, pantX+rnd(1), wireY2+2, 0.35, 0.7);

  // Wheels
  for (const wx2 of [x-TW/2+16, x-TW/2+46, x+TW/2-16, x+TW/2-46]) {
    ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.globalAlpha=0.78; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(wx2+rnd(0.5), GY+1, 9, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    // spokes
    pline(wx2-6, GY-3, wx2+6, GY+5, 0.3, 0.6);
    pline(wx2-6, GY+5, wx2+6, GY-3, 0.3, 0.6);
    pline(wx2, GY-8, wx2, GY+10, 0.25, 0.5);
  }
  // Axle
  pline(x-TW/2+16, GY+1, x-TW/2+46, GY+1, 0.35, 0.8);
  pline(x+TW/2-46, GY+1, x+TW/2-16, GY+1, 0.35, 0.8);

  // Destination board
  ctx.save();
  ctx.font='bold 6px Georgia'; ctx.fillStyle=INK;
  ctx.globalAlpha=0.55; ctx.textAlign='center';
  const ns2 = stations[nextStationIdx];
  ctx.fillText(ns2 ? ns2.name.substring(0,10) : '—', x-TW/2+30, ty+4);
  ctx.restore();

  ctx.restore();
}

requestAnimationFrame(loop);
</script>
