<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bahnsim 2D — SSB DT 8.12</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:#e6e1d3; display:block; overflow:hidden; font-family:'Georgia',serif; cursor:default; }
canvas { display:block; position:fixed; top:0; left:0; }
#hud { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:30px; color:#3a3530; font-size:12px; letter-spacing:.1em; opacity:.55; pointer-events:none; font-style:italic; user-select:none; }
#hud span { border-bottom:1px solid #999; padding-bottom:1px; }
#zone { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#4a443c; font-size:11px; font-style:italic; letter-spacing:.18em; opacity:0; transition:opacity 1.6s; pointer-events:none; }
#keys { position:fixed; bottom:16px; right:18px; color:#aaa39a; font-size:10px; text-align:right; line-height:1.8; pointer-events:none; font-style:italic; }
#dist { position:fixed; bottom:16px; left:18px; color:#aaa39a; font-size:10px; font-style:italic; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="h-speed">0 km/h</span>
  <span id="h-station">→ Hauptbahnhof</span>
  <span id="h-pax">0 Fahrgäste</span>
</div>
<div id="zone"></div>
<div id="keys">← → halten / fahren</div>
<div id="dist">0.0 km</div>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const zoneEl = document.getElementById('zone');
const distEl = document.getElementById('dist');

// ── Paper texture ───────────────────────────────────────────────────────────
const paper = document.createElement('canvas');
const pctx = paper.getContext('2d');
function buildPaper(){
  paper.width = canvas.width; paper.height = canvas.height;
  pctx.fillStyle='#ece7d8'; pctx.fillRect(0,0,paper.width,paper.height);
  const id=pctx.getImageData(0,0,paper.width,paper.height), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*16;
    d[i]=cl(d[i]+n); d[i+1]=cl(d[i+1]+n*.9); d[i+2]=cl(d[i+2]+n*.72);
  }
  pctx.putImageData(id,0,0);
  for(let y=0;y<paper.height;y+=2+Math.random()*6){
    pctx.globalAlpha=Math.random()*.018; pctx.strokeStyle='#9a8a68'; pctx.lineWidth=.3;
    pctx.beginPath(); pctx.moveTo(0,y); pctx.lineTo(paper.width,y+(Math.random()-.5)*1.2); pctx.stroke();
  }
  // a couple of soft smudges
  for(let s=0;s<5;s++){
    pctx.globalAlpha=.015; pctx.fillStyle='#8a7a58';
    pctx.beginPath();
    pctx.ellipse(Math.random()*paper.width,Math.random()*paper.height,80+Math.random()*160,40+Math.random()*100,Math.random()*3,0,Math.PI*2);
    pctx.fill();
  }
  pctx.globalAlpha=1;
}
function cl(v){return Math.max(0,Math.min(255,v));}
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; buildPaper(); }
resize(); addEventListener('resize',resize);

// ── Pencil primitives ───────────────────────────────────────────────────────
const INK='#2a2620', INKM='#5c544a', INKF='#9a9286';

function rnd(n){return(Math.random()-.5)*n;}

// wobbly multi-segment line
function pl(x1,y1,x2,y2,a=.55,w=1,s=0){
  if(!s){ const L=Math.hypot(x2-x1,y2-y1); s=Math.max(1,Math.round(L/16)); }
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1+rnd(.6),y1+rnd(.6));
  for(let i=1;i<=s;i++){const t=i/s; ctx.lineTo(x1+(x2-x1)*t+rnd(.9),y1+(y2-y1)*t+rnd(.9));}
  ctx.stroke();
  ctx.globalAlpha=a*.12; ctx.lineWidth=w*2.2;
  ctx.beginPath(); ctx.moveTo(x1+rnd(.7),y1+rnd(.7)); ctx.lineTo(x2+rnd(.7),y2+rnd(.7)); ctx.stroke();
  ctx.restore();
}
// straight crisp line (for vehicle, no double pass)
function ln(x1,y1,x2,y2,a=.6,w=1){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1+rnd(.5),y1+rnd(.5)); ctx.lineTo(x2+rnd(.5),y2+rnd(.5)); ctx.stroke();
  ctx.restore();
}
function pr(x,y,w,h,a=.55,lw=1){ pl(x,y,x+w,y,a,lw); pl(x+w,y,x+w,y+h,a,lw); pl(x+w,y+h,x,y+h,a,lw); pl(x,y+h,x,y,a,lw); }

function ht(x,y,w,h,a=.08,sp=6,ang=45){
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineWidth=.4; ctx.lineCap='round';
  ctx.beginPath();
  const r=ang*Math.PI/180, dg=Math.hypot(w,h)*1.6;
  for(let d=-dg;d<dg;d+=sp){
    const cx=x+w/2,cy=y+h/2;
    const ax=cx+d*Math.cos(r+Math.PI/2)-dg*Math.cos(r), ay=cy+d*Math.sin(r+Math.PI/2)-dg*Math.sin(r);
    const bx=cx+d*Math.cos(r+Math.PI/2)+dg*Math.cos(r), by=cy+d*Math.sin(r+Math.PI/2)+dg*Math.sin(r);
    const p=clip(ax,ay,bx,by,x,y,x+w,y+h);
    if(p){ctx.moveTo(p[0]+rnd(.3),p[1]+rnd(.3)); ctx.lineTo(p[2]+rnd(.3),p[3]+rnd(.3));}
  }
  ctx.stroke(); ctx.restore();
}
function clip(ax,ay,bx,by,x0,y0,x1,y1){
  let t0=0,t1=1; const dx=bx-ax,dy=by-ay;
  for(const[p,q]of[[-dx,ax-x0],[dx,x1-ax],[-dy,ay-y0],[dy,y1-ay]]){
    if(p===0){if(q<0)return null;continue;}
    const r=q/p; if(p<0){if(r>t1)return null;if(r>t0)t0=r;}else{if(r<t0)return null;if(r<t1)t1=r;}
  }
  return[ax+t0*dx,ay+t0*dy,ax+t1*dx,ay+t1*dy];
}

// ── Terrain (the heart: rolling hills the track follows) ──────────────────────
function terrainY(x){
  return  Math.sin(x*0.00042+0.5)*210
        + Math.sin(x*0.00091+1.3)*95
        + Math.sin(x*0.00220+2.1)*42
        + Math.sin(x*0.00500+0.2)*16;
}
function slopeAt(x){ const d=8; return (terrainY(x+d)-terrainY(x-d))/(2*d); }

// far mountain ridge
function ridgeY(x,seed){
  return  Math.sin(x*0.00030+seed)*150
        + Math.sin(x*0.00075+seed*1.7)*70
        + Math.sin(x*0.00170+seed*2.3)*30;
}

// ── World state ───────────────────────────────────────────────────────────────
let tramX=0, speed=0, dist=0;
const MAXS=300, ACC=120, BRK=240; // px/s
let camX=0, camY=0;
let autobrake=false, doorsOpen=false, doorT=0, boardT=0, pax=0, stoppedAt=null;

const stnNames=[
  'Hauptbahnhof','Stadtmitte','Marktplatz','Charlottenplatz','Olgaeck',
  'Bopser','Degerloch','Albstraße','Weinsteige','Ruhbank',
  'Waldau','Dornhalde','Südheimer Pl.','Möhringen','Fasanenhof',
  'Leinfelden','Echterdingen','Plieningen','Heumaden','Sillenbuch',
  'Riedenberg','Nordbahnhof','Cannstatt','Wilhelmsplatz','Mühlhausen',
  'Fellbach','Westbahnhof','Vogelsang','Heslach','Feuersee',
  'Hölderlinpl.','Eugensplatz','Geroksruhe','Stöckach','Gaisburg','Wangen',
];
const stations=[];
let sxw=900;
for(let i=0;i<400;i++){ sxw+=1100+Math.random()*900; stations.push({x:sxw,name:stnNames[i%stnNames.length],waiting:Math.floor(Math.random()*7)+1,served:false}); }
let nsi=0;

// scenery seeds
const scenery=[];
for(let i=0;i<6000;i++){
  const x=Math.random()*900000, r=Math.random();
  if     (r<.34) scenery.push({t:'pine', x,h:70+Math.random()*150});
  else if(r<.55) scenery.push({t:'tree', x,h:60+Math.random()*120});
  else if(r<.66) scenery.push({t:'bush', x,h:18+Math.random()*26});
  else if(r<.74) scenery.push({t:'rock', x,h:14+Math.random()*30});
  else if(r<.82) scenery.push({t:'grass',x,h:10+Math.random()*16});
  else if(r<.90) scenery.push({t:'house',x,w:60+Math.random()*55,h:48+Math.random()*40});
  else if(r<.95) scenery.push({t:'church',x,h:90+Math.random()*50});
  else           scenery.push({t:'factory',x,w:80+Math.random()*60,h:60+Math.random()*40});
}
scenery.sort((a,b)=>a.x-b.x);

const birds=Array.from({length:10},()=>({x:Math.random()*20000,y:-260-Math.random()*160,spd:18+Math.random()*40,flap:Math.random()*6}));
const clouds=Array.from({length:8},()=>({x:Math.random()*30000,y:-340-Math.random()*200,w:120+Math.random()*180}));

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
// touch / mouse hold halves
function pointer(px){ keys._left=px<innerWidth/2; keys._right=px>=innerWidth/2; }
addEventListener('mousedown',e=>pointer(e.clientX));
addEventListener('mouseup',()=>{keys._left=keys._right=false;});
addEventListener('touchstart',e=>{pointer(e.touches[0].clientX);},{passive:true});
addEventListener('touchend',()=>{keys._left=keys._right=false;});

const zones=['Talfahrt','Hügelland','Weinberge','Waldgebiet','Hochebene','Stadtrand','Bergland'];
let lastZone='';
let last=0;

function loop(ts){
  const dt=Math.min((ts-last)/1000,.05); last=ts||0;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const z=zones[Math.floor(tramX/22000)%zones.length];
  if(z!==lastZone){ lastZone=z; zoneEl.textContent=z; zoneEl.style.opacity='.7'; clearTimeout(update._zt); update._zt=setTimeout(()=>zoneEl.style.opacity='0',2400); }

  while(nsi<stations.length-1&&stations[nsi].served) nsi++;
  const ns=stations[nsi];
  const d=ns.x-tramX;
  const bd=(speed*speed)/(2*BRK)+60;
  autobrake = d<bd && d>-25 && !stoppedAt;

  if(d<=0 && !stoppedAt && speed<6){ speed=0; stoppedAt=ns; doorsOpen=false; doorT=.5; boardT=2.8; }
  if(stoppedAt){
    doorT-=dt; if(doorT<=0&&!doorsOpen) doorsOpen=true;
    if(doorsOpen){ boardT-=dt; if(boardT<=0){ pax=Math.max(0,pax-Math.floor(Math.random()*4+1)); pax=Math.min(42,pax+Math.min(stoppedAt.waiting,42-pax)); stoppedAt.waiting=0; stoppedAt.served=true; stoppedAt=null; doorsOpen=false; } }
  }

  const left = keys.ArrowLeft||keys.KeyA||keys._left;
  const right= keys.ArrowRight||keys.KeyD||keys._right;
  if(!stoppedAt){
    if(left) speed=Math.max(0,speed-BRK*dt);
    else if(autobrake) speed=Math.max(0,speed-BRK*dt);
    else if(right) speed=Math.min(MAXS,speed+ACC*dt);
    else speed=Math.min(MAXS*.55,speed+ACC*.35*dt); // gentle auto-coast
  }
  // slope affects speed slightly (gravity feel)
  const sl=slopeAt(tramX);
  if(!stoppedAt) speed=Math.max(0,Math.min(MAXS,speed - sl*40*dt*60*0));

  tramX+=speed*dt; dist+=speed*dt;

  // camera: keep tram at fixed screen anchor, follow terrain vertically (smooth)
  const targetCamX = tramX - canvas.width*0.36;
  const targetCamY = terrainY(tramX) - canvas.height*0.60;
  camX = targetCamX;
  camY += (targetCamY-camY)*Math.min(1,dt*4);

  for(const b of birds){ b.x+=b.spd*dt; b.flap+=dt*3; if(b.x-camX>canvas.width+200) b.x-=22000; }
  for(const c of clouds){ c.x-=dt*6; if(c.x-camX< -400) c.x+=30000; }

  document.getElementById('h-speed').textContent=Math.round(speed*0.235/5)*5+' km/h';
  document.getElementById('h-station').textContent='→ '+ns.name+(d<400?' ·':'');
  document.getElementById('h-pax').textContent=pax+' Fahrgäste';
  distEl.textContent=(dist/1000).toFixed(2)+' km';
}

// world→screen
const SX = wx => wx - camX;
const SY = wy => wy - camY;

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.drawImage(paper,0,0);

  // clouds (very faint)
  for(const c of clouds){
    const x=SX(c.x), y=SY(c.y);
    if(x< -400||x>W+400) continue;
    ctx.save(); ctx.globalAlpha=.06; ctx.strokeStyle=INKF; ctx.lineWidth=.6;
    for(let j=0;j<4;j++){ ctx.beginPath(); ctx.ellipse(x+j*c.w*.22+rnd(6),y+rnd(6),c.w*.28,c.w*.11,0,0,Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }

  // far mountains — 2 layers parallax
  drawRidge(0.30, 4.1, -180, .16, true);
  drawRidge(0.55, 1.7, -90,  .24, false);

  // birds
  for(const b of birds){
    const x=SX(b.x), y=SY(b.y); if(x<-40||x>W+40) continue;
    ctx.save(); ctx.globalAlpha=.26; ctx.strokeStyle=INK; ctx.lineWidth=.7; ctx.lineCap='round';
    const f=Math.sin(b.flap)*5;
    ctx.beginPath(); ctx.moveTo(x-8,y+f); ctx.quadraticCurveTo(x-3,y,x,y+2); ctx.quadraticCurveTo(x+3,y,x+8,y+f); ctx.stroke(); ctx.restore();
  }

  // ground fill under terrain
  drawGround();

  // scenery behind track (visible window range)
  const x0=camX-200, x1=camX+W+200;
  // binary-ish scan: scenery sorted by x
  let i=lowerBound(scenery,x0);
  for(; i<scenery.length; i++){
    const o=scenery[i]; if(o.x>x1) break;
    const gx=SX(o.x), gy=SY(terrainY(o.x));
    drawScenery(o,gx,gy);
  }

  // telegraph poles + wire
  drawPoles();

  // stations
  for(let k=Math.max(0,nsi-2); k<stations.length; k++){
    const s=stations[k]; if(s.x>x1) break; if(s.x<x0) continue;
    drawStation(s);
  }

  // track
  drawTrack();

  // tram
  drawTram();

  // foreground grass blades (fast parallax) — subtle
  drawForeground();

  // vignette
  ctx.save();
  const v=ctx.createRadialGradient(W/2,H*.48,H*.25,W/2,H*.5,H*.9);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(20,16,10,.26)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H); ctx.restore();
}

function lowerBound(arr,x){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m].x<x)lo=m+1;else hi=m;} return lo; }

function drawRidge(parallax, seed, screenOff, alpha, hatched){
  const W=canvas.width,H=canvas.height;
  const pcx=camX*parallax;
  const baseY = SY(0)*0.25 + H*0.34 + screenOff; // dampened vertical follow
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=INKM; ctx.lineWidth=.9; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  let first=true;
  for(let px=-40;px<=W+40;px+=10){
    const wx=pcx+px; const y=baseY+ridgeY(wx,seed);
    if(first){ctx.moveTo(px,y); first=false;} else ctx.lineTo(px+rnd(.5),y+rnd(.6));
  }
  ctx.stroke();
  if(hatched){
    ctx.globalAlpha=alpha*0.5; ctx.lineWidth=.4;
    for(let px=-40;px<=W+40;px+=14){
      const wx=pcx+px; const y=baseY+ridgeY(wx,seed);
      ctx.beginPath(); ctx.moveTo(px,y+2); ctx.lineTo(px-6,y+18+Math.random()*10); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawGround(){
  const W=canvas.width,H=canvas.height;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-20,H+20);
  for(let px=-20;px<=W+20;px+=6){ const wx=camX+px; ctx.lineTo(px,SY(terrainY(wx))); }
  ctx.lineTo(W+20,H+20); ctx.closePath();
  ctx.globalAlpha=.05; ctx.fillStyle='#6b6256'; ctx.fill();
  ctx.restore();

  // terrain top line
  ctx.save(); ctx.globalAlpha=.5; ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let px=-20;px<=W+20;px+=6){ const wx=camX+px; const y=SY(terrainY(wx)); px===-20?ctx.moveTo(px,y):ctx.lineTo(px+rnd(.4),y+rnd(.5)); }
  ctx.stroke();
  // ghost
  ctx.globalAlpha=.08; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();

  // sparse ground hatch just under the line
  ctx.save(); ctx.globalAlpha=.05; ctx.strokeStyle=INK; ctx.lineWidth=.4;
  for(let px=0;px<=W;px+=10){
    const wx=camX+px; const y=SY(terrainY(wx));
    ctx.beginPath(); ctx.moveTo(px+rnd(2),y+3); ctx.lineTo(px-5+rnd(2),y+16+Math.random()*8); ctx.stroke();
  }
  ctx.restore();
}

// ── Scenery drawers (all vertical — gravity) ─────────────────────────────────
function drawScenery(o,gx,gy){
  if(gx<-150||gx>canvas.width+150) return;
  ctx.save();
  if(o.t==='pine')   drawPine(gx,gy,o.h);
  else if(o.t==='tree')  drawTree(gx,gy,o.h);
  else if(o.t==='bush')  drawBush(gx,gy,o.h);
  else if(o.t==='rock')  drawRock(gx,gy,o.h);
  else if(o.t==='grass') drawGrass(gx,gy,o.h);
  else if(o.t==='house') drawHouse(gx,gy,o.w,o.h);
  else if(o.t==='church')drawChurch(gx,gy,o.h);
  else if(o.t==='factory')drawFactory(gx,gy,o.w,o.h);
  ctx.restore();
}

function drawPine(x,gy,h){
  const a=.5;
  pl(x,gy,x,gy-h,a,1.1);
  for(let i=0;i<6;i++){
    const t=i/6, ly=gy-h*(.10+t*.85), lw=h*(.30-t*.20);
    pl(x-lw+rnd(1.5),ly+h*.04,x+rnd(2),ly-h*.10,a*.9,.9,2);
    pl(x+lw+rnd(1.5),ly+h*.04,x+rnd(2),ly-h*.10,a*.9,.9,2);
  }
}
function drawTree(x,gy,h){
  const a=.5;
  pl(x-2,gy,x-1,gy-h*.4,a,1.4);
  pl(x+2,gy,x+1,gy-h*.4,a*.7,.9);
  const cy=gy-h*.4-h*.3, rx=h*.32, ry=h*.32;
  // soft scribble canopy: a few overlapping wobbly arcs
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.lineCap='round';
  for(let lobe=0;lobe<3;lobe++){
    const ox=rnd(rx*.6), oy=rnd(ry*.4);
    ctx.beginPath();
    for(let s=0;s<=14;s++){const ang=(s/14)*Math.PI*2; const px=x+ox+Math.cos(ang)*rx*.6+rnd(1.4), py=cy+oy+Math.sin(ang)*ry*.6+rnd(1.4); s?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.stroke();
  }
  ctx.restore();
}
function drawBush(x,gy,h){
  ctx.save(); ctx.globalAlpha=.45; ctx.strokeStyle=INK; ctx.lineWidth=.9; ctx.lineCap='round';
  for(let lobe=0;lobe<3;lobe++){
    const ox=(lobe-1)*h*.6;
    ctx.beginPath();
    for(let s=0;s<=12;s++){const ang=Math.PI+(s/12)*Math.PI; const px=x+ox+Math.cos(ang)*h*.7+rnd(1.2), py=gy+Math.sin(ang)*h+rnd(1.2); s?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.stroke();
  }
  ctx.restore();
}
function drawRock(x,gy,h){
  ctx.save(); ctx.globalAlpha=.5; ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(x-h,gy);
  ctx.lineTo(x-h*.5,gy-h*.9+rnd(2));
  ctx.lineTo(x+h*.2,gy-h+rnd(2));
  ctx.lineTo(x+h,gy-h*.4+rnd(2));
  ctx.lineTo(x+h*1.1,gy);
  ctx.stroke();
  ctx.restore();
  ht(x-h,gy-h,h*2,h,.05,4,40);
}
function drawGrass(x,gy,h){
  for(let b=0;b<4;b++){ const bx=x+rnd(8); pl(bx,gy,bx+rnd(4)-1,gy-h-Math.random()*5,.22,.5,2); }
}
function drawHouse(x,gy,w,h){
  ht(x-w/2,gy-h,w,h,.05,9,90); pr(x-w/2,gy-h,w,h,.5,1);
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.1; ctx.globalAlpha=.55; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-w/2-5,gy-h); ctx.lineTo(x,gy-h-h*.5); ctx.lineTo(x+w/2+5,gy-h); ctx.stroke(); ctx.restore();
  ht(x-w/2-5,gy-h-h*.5,w+10,h*.5,.06,4,130);
  const nc=Math.max(1,Math.floor(w/26));
  for(let k=0;k<nc;k++){ const wx=x-w/2+13+k*(w-18)/Math.max(nc-1,1); pr(wx-5,gy-h*.6,10,9,.45,.7); pl(wx,gy-h*.6,wx,gy-h*.6+9,.2,.4); pl(wx-5,gy-h*.6+4.5,wx+5,gy-h*.6+4.5,.2,.4); }
  pr(x-4,gy-h*.38,8,h*.38,.42,.7);
}
function drawChurch(x,gy,h){
  const w=h*.42;
  ht(x-w/2,gy-h*.62,w,h*.62,.05,9,90); pr(x-w/2,gy-h*.62,w,h*.62,.5,.9);
  pr(x-10,gy-h,20,h,.52,.9); ht(x-10,gy-h,20,h,.06,5,90);
  pl(x-11,gy-h,x,gy-h-h*.42,.55,1); pl(x+11,gy-h,x,gy-h-h*.42,.55,1);
  pl(x,gy-h-h*.34,x,gy-h-h*.14,.5,1); pl(x-6,gy-h-h*.26,x+6,gy-h-h*.26,.5,1);
}
function drawFactory(x,gy,w,h){
  ht(x-w/2,gy-h,w,h,.05,8,90); pr(x-w/2,gy-h,w,h,.5,1);
  pr(x-w*.25-6,gy-h-38,12,38,.5,.9); ht(x-w*.25-6,gy-h-38,12,38,.06,5,90);
  for(let s=0;s<3;s++){ ctx.save(); ctx.globalAlpha=.05; ctx.strokeStyle=INKF; ctx.lineWidth=.5; ctx.beginPath(); ctx.ellipse(x-w*.25+rnd(3),gy-h-40-s*10,4+s*2,3+s,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  const nc=Math.max(2,Math.floor(w/24));
  for(let k=0;k<nc;k++){ const wx=x-w/2+15+k*(w-26)/Math.max(nc-1,1); pr(wx-5,gy-h*.6,10,13,.4,.7); }
}

// ── Telegraph poles & wire (classic Short Trip) ──────────────────────────────
function drawPoles(){
  const W=canvas.width, sp=360;
  const tops=[];
  for(let wx=Math.floor((camX-sp)/sp)*sp; wx<camX+W+sp; wx+=sp){
    const gx=SX(wx), gy=SY(terrainY(wx));
    const top=gy-150;
    pl(gx,gy,gx,top,.4,1.1);
    // cross arms
    pl(gx-12,top+14,gx+12,top+14,.34,.9);
    pl(gx-12,top+26,gx+12,top+26,.30,.8);
    tops.push([gx,top+10]);
  }
  // wires sag between tops
  ctx.save(); ctx.globalAlpha=.28; ctx.strokeStyle=INKM; ctx.lineWidth=.6; ctx.lineCap='round';
  for(let k=0;k<tops.length-1;k++){
    const a=tops[k], b=tops[k+1];
    for(const off of [-9,9]){
      ctx.beginPath();
      ctx.moveTo(a[0],a[1]+ (off<0?4:16));
      ctx.quadraticCurveTo((a[0]+b[0])/2, Math.max(a[1],b[1])+(off<0?26:40), b[0], b[1]+(off<0?4:16));
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ── Station ───────────────────────────────────────────────────────────────────
function drawStation(s){
  const gx=SX(s.x), gy=SY(terrainY(s.x));
  if(gx<-200||gx>canvas.width+200) return;
  // platform (short, on terrain)
  const pw=110;
  ht(gx-pw/2,gy-7,pw,7,.08,4,0); pr(gx-pw/2,gy-7,pw,7,.5,1.1);
  // shelter
  const sw=58, sh=42, ry=gy-7-sh;
  pl(gx-sw/2,gy-7,gx-sw/2,ry,.48,1);
  pl(gx+sw/2,gy-7,gx+sw/2,ry,.48,1);
  pl(gx-sw/2-7,ry,gx+sw/2+7,ry,.55,1.4);
  pl(gx-sw/2-7,ry,gx-sw/2-15,ry-9,.42,.9);
  pl(gx+sw/2+7,ry,gx+sw/2+15,ry-9,.42,.9);
  pl(gx-sw/2-15,ry-9,gx+sw/2+15,ry-9,.36,.8);
  ht(gx-sw/2-15,ry-9,sw+30,9,.06,4,130);
  // name board
  pr(gx-sw/2,ry-19,sw,13,.32,.6);
  ctx.save(); ctx.font='italic 10px Georgia'; ctx.fillStyle=INK; ctx.globalAlpha=.6; ctx.textAlign='center'; ctx.fillText(s.name,gx,ry-9); ctx.restore();
  // waiting people
  for(let k=0;k<s.waiting;k++) drawPerson(gx-pw/2+12+k*13+rnd(2),gy-7,false);
}

function drawPerson(x,y,onboard){
  const h=onboard?16:22, a=onboard?.45:.55;
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineWidth=.85;
  ctx.beginPath(); ctx.arc(x+rnd(.4),y-h+rnd(.4),3,0,Math.PI*2); ctx.stroke();
  pl(x,y-h+3,x+rnd(1),y-h*.4,a,.95,2);
  pl(x-4,y-h*.58,x+4,y-h*.58+rnd(1),a,.8,1);
  pl(x,y-h*.4,x-3+rnd(1),y,a,.95,2);
  pl(x,y-h*.4,x+3+rnd(1),y,a,.95,2);
  ctx.restore();
}

// ── Track (follows terrain) ─────────────────────────────────────────────────
function drawTrack(){
  const W=canvas.width;
  // two rails offset vertically, sleepers perpendicular to slope
  ctx.save();
  // sleepers
  const sp=18;
  for(let wx=Math.floor((camX-40)/sp)*sp; wx<camX+W+40; wx+=sp){
    const gx=SX(wx), gy=SY(terrainY(wx));
    const sl=slopeAt(wx), ang=Math.atan(sl);
    const nx=Math.sin(ang), ny=-Math.cos(ang); // normal
    pl(gx-nx*9, gy+2-ny*9, gx+nx*9, gy+2+ny*9, .26,2.4,1);
  }
  // rails
  for(const off of [3,11]){
    ctx.globalAlpha=.55; ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let px=-30;px<=W+30;px+=6){ const wx=camX+px; const y=SY(terrainY(wx))+off; px===-30?ctx.moveTo(px,y):ctx.lineTo(px+rnd(.3),y+rnd(.3)); }
    ctx.stroke();
  }
  ctx.restore();
}

// ── Tram: SSB DT 8.12 (drawn in local space, tilts with slope) ───────────────
function drawTram(){
  const gx=SX(tramX), gy=SY(terrainY(tramX));
  const ang=Math.atan(slopeAt(tramX));
  ctx.save();
  ctx.translate(gx,gy);
  ctx.rotate(ang);
  drawDT812Local();
  ctx.restore();
}

// Local origin = contact point of wheels on rail (y=0 at rail top)
function drawDT812Local(){
  const L=300;            // total length
  const half=L/2;
  const wheelR=11;
  const bodyBot=-wheelR-6;   // bottom of body sits above wheels
  const bodyTop=bodyBot-78;  // body height ~78
  const TH=bodyBot-bodyTop;  // positive height
  const left=-half, right=half;

  // section split: front cab / mid / rear cab
  const fW=L*0.27, mW=L*0.46, rW=L-fW-mW;
  const fX=left, mX=left+fW, rX=left+fW+mW;

  // ── shadow on ground ──
  ctx.save(); ctx.globalAlpha=.06; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(0,2,half*0.92,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();

  // ── body fill faint ──
  ctx.save(); ctx.globalAlpha=.07; ctx.fillStyle='#cfcabd';
  roundBodyPath(left,right,bodyTop,bodyBot,fW,rW); ctx.fill(); ctx.restore();

  // ── roof equipment ──
  const roofH=8;
  pr(left+fW*.5,bodyTop-roofH,L-fW*.5-rW*.5,roofH,.22,.8);
  for(const bx of [mX+mW*.2, mX+mW*.5, mX+mW*.8]){ pr(bx-10,bodyTop-roofH+1,20,roofH-2,.2,.6); }

  // ── pantographs (folded diamond) ──
  drawPanto(mX+mW*0.28, bodyTop-roofH);
  drawPanto(mX+mW*0.72, bodyTop-roofH);

  // ── window band (mid section) ──
  const winTop=bodyTop+TH*0.16, winBot=bodyTop+TH*0.60;
  ctx.save(); ctx.globalAlpha=.05; ctx.fillStyle='#9bbccc';
  ctx.fillRect(mX+4,winTop,mW-8,winBot-winTop); ctx.restore();
  ln(mX+4,winTop,mX+mW-4,winTop,.45,1);
  ln(mX+4,winBot,mX+mW-4,winBot,.45,1);
  // doors in mid (4) — DT 8.12 oval-ish dark panels
  const doorPos=[mX+mW*.12,mX+mW*.37,mX+mW*.62,mX+mW*.87];
  for(const dx of doorPos) drawDoor(dx-9,bodyTop+TH*0.12,18,TH*0.74);
  // window mullions between doors
  for(let m=0;m<5;m++){ const mxp=mX+mW*(0.24+m*0.13); ln(mxp,winTop,mxp,winBot,.22,.6); }
  // passengers
  const slots=Math.floor((mW-30)/24);
  for(let p=0;p<slots;p++){ if(p<pax/3) drawPersonLocal(mX+18+p*24,winBot-1); }

  // ── front & rear cabs ──
  drawCab(fX,fW,bodyTop,bodyBot,TH,false);
  drawCab(rX,rW,bodyTop,bodyBot,TH,true);

  // ── articulation joints ──
  drawJoint(mX,bodyTop,bodyBot);
  drawJoint(rX,bodyTop,bodyBot);

  // ── outline (crisp) ──
  ctx.save(); ctx.globalAlpha=.78; ctx.strokeStyle=INK; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.lineJoin='round';
  roundBodyPath(left,right,bodyTop,bodyBot,fW,rW); ctx.stroke();
  ctx.globalAlpha=.1; ctx.lineWidth=4; ctx.stroke();
  ctx.restore();

  // ── waist stripe ──
  ln(left+fW*.4,bodyTop+TH*0.64,right-rW*.4,bodyTop+TH*0.64,.2,.7);

  // ── bogies ──
  drawBogie(fX+fW*.30,wheelR);
  drawBogie(fX+fW*.82,wheelR);
  drawBogie(mX+mW+rW*.18,wheelR);
  drawBogie(mX+mW+rW*.70,wheelR);

  // ── SSB lettering ──
  ctx.save(); ctx.globalAlpha=.4; ctx.fillStyle=INK; ctx.font='bold 13px Georgia'; ctx.textAlign='right';
  ctx.fillText('SSB',right-rW*0.16,bodyTop+TH*0.5);
  ctx.font='9px Georgia'; ctx.globalAlpha=.28; ctx.fillText('3503',right-rW*0.16,bodyTop+TH*0.66);
  ctx.restore();
}

function roundBodyPath(left,right,top,bot,fW,rW){
  const r=10, nose=14;
  ctx.beginPath();
  // front nose (left) — wedge: top corner rounded, lower apron angled out
  ctx.moveTo(left+nose, top);
  ctx.lineTo(right-nose, top);
  ctx.quadraticCurveTo(right, top, right+2, top+18);     // rear top corner
  ctx.lineTo(right+2, bot-10);
  ctx.quadraticCurveTo(right+2, bot, right-8, bot);        // rear lower
  ctx.lineTo(left+8, bot);
  ctx.quadraticCurveTo(left-2, bot, left-2, bot-10);       // front lower
  ctx.lineTo(left-2, top+18);
  ctx.quadraticCurveTo(left, top, left+nose, top);         // front top corner
  ctx.closePath();
}

function drawCab(sx,sw,top,bot,TH,mirror){
  const d=mirror?-1:1;
  const nose=mirror?sx+sw:sx;
  // windshield
  const wsW=sw*0.5;
  const wsX=mirror? nose-d*(sw*0.08)-wsW : nose+d*(sw*0.08);
  const wsTop=top+TH*0.10, wsBot=top+TH*0.46;
  ctx.save(); ctx.globalAlpha=.05; ctx.fillStyle='#9bbccc'; ctx.fillRect(Math.min(wsX,wsX+wsW),wsTop,wsW,wsBot-wsTop); ctx.restore();
  pr(Math.min(wsX,wsX+wsW),wsTop,wsW,wsBot-wsTop,.55,1);
  ln(Math.min(wsX,wsX+wsW)+wsW/2,wsTop,Math.min(wsX,wsX+wsW)+wsW/2,wsBot,.25,.6);
  // destination box
  const ddX=mirror? nose-d*sw*0.6 : nose+d*sw*0.1;
  pr(Math.min(ddX,ddX+sw*0.5),top+3,sw*0.5,TH*0.09,.45,.8);
  ctx.save(); ctx.font='bold 8px Georgia'; ctx.fillStyle=INK; ctx.globalAlpha=.45; ctx.textAlign='center';
  const ns=stations[nsi];
  ctx.fillText((ns?ns.name:'—').substring(0,9),Math.min(ddX,ddX+sw*0.5)+sw*0.25,top+3+TH*0.075); ctx.restore();
  // headlights
  const hlY=top+TH*0.72, hlX=nose+d*6;
  ctx.save(); ctx.globalAlpha=.5; ctx.strokeStyle=INK; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(hlX,hlY,4,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(hlX,hlY-TH*0.12,2.4,0,Math.PI*2); ctx.stroke(); ctx.restore();
  // one door on cab section (inboard)
  const doorX=mirror? nose-d*sw*0.78 : nose+d*sw*0.62;
  drawDoor(Math.min(doorX,doorX+18),top+TH*0.14,18,TH*0.72);
}

function drawDoor(dx,dy,dw,dh){
  if(doorsOpen){
    ln(dx-3,dy,dx-3,dy+dh*0.12,.45,1);
    ln(dx+dw+3,dy,dx+dw+3,dy+dh*0.12,.45,1);
    ht(dx,dy,dw,dh,.03,5,90);
  } else {
    ht(dx,dy,dw,dh,.07,6,90);
    pr(dx,dy,dw,dh,.55,1);
    ln(dx+dw/2,dy+2,dx+dw/2,dy+dh-2,.3,.7);
    ctx.save(); ctx.globalAlpha=.3; ctx.strokeStyle=INK; ctx.lineWidth=.6; ctx.beginPath(); ctx.arc(dx+dw/2,dy+dh*.5,2,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
}

function drawJoint(x,top,bot){
  const jw=6, jx=x-jw/2;
  ctx.save(); ctx.globalAlpha=.4; ctx.strokeStyle=INK; ctx.lineWidth=.7; ctx.lineCap='round';
  const H=bot-top;
  for(let z=0;z<5;z++){ const zy=top+H*0.14+z*(H*0.7/5); ctx.beginPath(); ctx.moveTo(jx,zy); ctx.lineTo(jx+jw,zy+H*0.07); ctx.lineTo(jx,zy+H*0.14); ctx.stroke(); }
  ctx.restore();
  ln(jx,top+5,jx,bot-3,.22,.6); ln(jx+jw,top+5,jx+jw,bot-3,.22,.6);
}

function drawPanto(cx,roofY){
  const topY=roofY-26;
  ln(cx-12,roofY,cx-3,topY+6,.5,1);
  ln(cx+12,roofY,cx+3,topY+6,.5,1);
  ln(cx-3,topY+6,cx+3,topY+6,.55,1.2);
  ln(cx-14,roofY,cx+14,roofY,.38,.9);
  ln(cx,topY+6,cx,topY,.3,.7);
}

function drawBogie(cx,wr){
  const tr=22;
  ctx.save(); ctx.globalAlpha=.7; ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.lineCap='round';
  ln(cx-tr/2-wr,-wr-2,cx+tr/2+wr,-wr-2,.4,1.6);
  for(const wx of [cx-tr/2,cx+tr/2]){
    ctx.beginPath(); ctx.arc(wx,0,wr,0,Math.PI*2); ctx.stroke();
    for(let s=0;s<3;s++){ const a=s*Math.PI/3; ln(wx+Math.cos(a)*wr*.6,Math.sin(a)*wr*.6,wx-Math.cos(a)*wr*.6,-Math.sin(a)*wr*.6,.22,.5); }
    ctx.save(); ctx.globalAlpha=.35; ctx.beginPath(); ctx.arc(wx,0,wr*.22,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

function drawPersonLocal(x,y){ // passenger silhouette inside (local coords)
  const h=15, a=.4;
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineWidth=.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y-h,2.6,0,Math.PI*2); ctx.stroke();
  ln(x,y-h+2.6,x,y-h*.45,a,.9);
  ln(x,y-h*.45,x-2.5,y,a,.9); ln(x,y-h*.45,x+2.5,y,a,.9);
  ctx.restore();
}

// ── Foreground (fast, subtle) ─────────────────────────────────────────────────
function drawForeground(){
  const W=canvas.width,H=canvas.height;
  const sp=70, pcx=camX*1.25;
  ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle=INK; ctx.lineWidth=.6; ctx.lineCap='round';
  for(let wx=Math.floor((pcx-sp)/sp)*sp; wx<pcx+W+sp; wx+=sp){
    const x=wx-pcx;
    for(let b=0;b<3;b++){ const bx=x+rnd(14); ctx.beginPath(); ctx.moveTo(bx,H); ctx.quadraticCurveTo(bx+rnd(6),H-18,bx+rnd(10)-3,H-30-Math.random()*14); ctx.stroke(); }
  }
  ctx.restore();
}

requestAnimationFrame(loop);
</script>
