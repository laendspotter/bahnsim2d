<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bahnsim 2D — SSB Doppeltriebwagen</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:#f6f1e3; display:block; overflow:hidden; font-family:'Georgia',serif; cursor:default; }
canvas { display:block; position:fixed; top:0; left:0; }
#hud { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:38px; color:#3a342a; font-size:11px; letter-spacing:.18em; opacity:.5; pointer-events:none; font-style:italic; user-select:none; text-transform:lowercase; }
#zone { position:fixed; top:24px; left:50%; transform:translateX(-50%); color:#3a342a; font-size:10px; font-style:italic; letter-spacing:.32em; opacity:0; transition:opacity 1.6s; pointer-events:none; text-transform:uppercase; }
#keys { position:fixed; bottom:18px; right:22px; color:#9c9484; font-size:10px; text-align:right; line-height:1.8; pointer-events:none; font-style:italic; }
#dist { position:fixed; bottom:18px; left:22px; color:#9c9484; font-size:10px; font-style:italic; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="h-speed">0 km/h</span>
  <span id="h-station">→ Hauptbahnhof</span>
  <span id="h-pax">0 Fahrgäste</span>
</div>
<div id="zone"></div>
<div id="keys">← rückwärts &nbsp; → vorwärts</div>
<div id="dist">0.0 km</div>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const zoneEl = document.getElementById('zone');
const distEl = document.getElementById('dist');

// deterministic randomness
let _s=1;
function srand(seed){ _s=(Math.abs(Math.floor(seed))>>>0)||1; }
function frand(){ _s=(_s*1664525+1013904223)>>>0; return _s/4294967296; }
function rnd(n){ return (frand()-.5)*n; }

// paper — quiet cream with very subtle grain
const paper = document.createElement('canvas');
const pctx = paper.getContext('2d');
function buildPaper(){
  paper.width=canvas.width; paper.height=canvas.height;
  pctx.fillStyle='#f6f1e3'; pctx.fillRect(0,0,paper.width,paper.height);
  const id=pctx.getImageData(0,0,paper.width,paper.height), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*5;
    d[i]=cl(d[i]+n); d[i+1]=cl(d[i+1]+n*.9); d[i+2]=cl(d[i+2]+n*.7);
  }
  pctx.putImageData(id,0,0);
}
function cl(v){return Math.max(0,Math.min(255,v));}
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; buildPaper(); }
resize(); addEventListener('resize',resize);

const INK='#2a2620';

// — primitives: clean pencil lines, very subtle wobble —
function pl(x1,y1,x2,y2,a=.7,w=1){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(x1+rnd(.3),y1+rnd(.3));
  const L=Math.hypot(x2-x1,y2-y1), s=Math.max(1,Math.round(L/22));
  for(let i=1;i<=s;i++){const t=i/s; ctx.lineTo(x1+(x2-x1)*t+rnd(.5),y1+(y2-y1)*t+rnd(.5));}
  ctx.stroke();
  ctx.restore();
}
function ln(x1,y1,x2,y2,a=.7,w=1){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}

// soft pencil shading – low alpha diagonal hatch confined to a path callback
function softShade(pathFn, alpha, spacing){
  ctx.save();
  ctx.beginPath(); pathFn();
  ctx.clip();
  ctx.globalAlpha=alpha; ctx.strokeStyle=INK; ctx.lineWidth=.55; ctx.lineCap='round';
  const W=canvas.width, H=canvas.height, sp=spacing||5;
  ctx.beginPath();
  for(let y=-H; y<H*2; y+=sp){
    ctx.moveTo(-20, y);
    ctx.lineTo(W+20, y+W);
  }
  ctx.stroke();
  ctx.restore();
}

// terrain
function terrainY(x){
  return  Math.sin(x*0.00042+0.5)*180
        + Math.sin(x*0.00091+1.3)*80
        + Math.sin(x*0.00220+2.1)*32
        + Math.sin(x*0.00500+0.2)*12;
}
function slopeAt(x){ const d=8; return (terrainY(x+d)-terrainY(x-d))/(2*d); }
function ridgeY(x,seed){
  return  Math.sin(x*0.00030+seed)*130
        + Math.sin(x*0.00075+seed*1.7)*55
        + Math.sin(x*0.00170+seed*2.3)*22;
}

// state — Short-Trip momentum
let tramX=0, vel=0, dist=0;
const ENGINE=150, GRAVITY=330, DRAG=0.7, ROLL=28;
let camX=0, camY=0;
let doorsOpen=false, doorT=0, boardT=0, pax=0, stoppedAt=null;
let destName='Hauptbahnhof';

const stnNames=[
  'Hauptbahnhof','Stadtmitte','Marktplatz','Charlottenplatz','Olgaeck',
  'Bopser','Degerloch','Albstraße','Weinsteige','Ruhbank',
  'Waldau','Dornhalde','Südheimer Pl.','Möhringen','Fasanenhof',
  'Leinfelden','Echterdingen','Plieningen','Heumaden','Sillenbuch',
  'Riedenberg','Nordbahnhof','Cannstatt','Wilhelmsplatz','Mühlhausen',
  'Fellbach','Westbahnhof','Vogelsang','Heslach','Feuersee',
  'Hölderlinpl.','Eugensplatz','Geroksruhe','Stöckach','Gaisburg','Wangen',
];
const stations=[];
{ let sxw=900;
  for(let i=0;i<2000;i++){ sxw+=900+Math.random()*800; stations.push({x:sxw,name:stnNames[i%stnNames.length],waiting:Math.floor(Math.random()*5)+1,served:false}); } }

const scenery=[];
for(let i=0;i<6000;i++){
  const x=Math.random()*900000, r=Math.random();
  if     (r<.38) scenery.push({t:'pine', x,h:90+Math.random()*150});
  else if(r<.60) scenery.push({t:'tree', x,h:70+Math.random()*100});
  else if(r<.74) scenery.push({t:'bush', x,h:14+Math.random()*16});
  else if(r<.84) scenery.push({t:'grass',x,h:10+Math.random()*8});
  else if(r<.93) scenery.push({t:'house',x,w:74+Math.random()*54,h:54+Math.random()*40});
  else           scenery.push({t:'barn', x,w:88+Math.random()*44,h:48+Math.random()*30});
}
scenery.sort((a,b)=>a.x-b.x);

const birds=Array.from({length:7},()=>({x:Math.random()*20000,y:-280-Math.random()*180,spd:18+Math.random()*40,flap:Math.random()*6}));

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
function pointer(px){ keys._left=px<innerWidth/2; keys._right=px>=innerWidth/2; }
addEventListener('mousedown',e=>pointer(e.clientX));
addEventListener('mouseup',()=>{keys._left=keys._right=false;});
addEventListener('touchstart',e=>{pointer(e.touches[0].clientX);},{passive:true});
addEventListener('touchend',()=>{keys._left=keys._right=false;});

const zones=['Talfahrt','Hügelland','Weinberge','Waldgebiet','Hochebene','Stadtrand','Bergland'];
let lastZone='';
let last=0;

function loop(ts){
  const dt=Math.min((ts-last)/1000,.05); last=ts||0;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const z=zones[Math.floor(Math.max(0,tramX)/22000)%zones.length];
  if(z!==lastZone){ lastZone=z; zoneEl.textContent=z; zoneEl.style.opacity='.65'; clearTimeout(update._zt); update._zt=setTimeout(()=>zoneEl.style.opacity='0',2400); }

  const left = keys.ArrowLeft||keys.KeyA||keys._left;
  const right= keys.ArrowRight||keys.KeyD||keys._right;

  if(!stoppedAt){
    const slope=slopeAt(tramX);
    const theta=Math.atan(slope);
    let a=0;
    if(right) a+=ENGINE;
    if(left)  a-=ENGINE;
    a+=GRAVITY*Math.sin(theta);
    vel+=a*dt;
    vel*=Math.exp(-DRAG*dt);
    if(Math.abs(vel)>0.01){ const rr=ROLL*dt; vel+=(vel>0?-1:1)*Math.min(rr,Math.abs(vel)); }
    if(!left&&!right&&Math.abs(vel)<5&&Math.abs(GRAVITY*Math.sin(theta))<ROLL) vel=0;
    tramX+=vel*dt;
    dist+=Math.abs(vel)*dt;
  } else vel=0;

  if(!stoppedAt && Math.abs(vel)<7){
    let i=lowerBound(stations,tramX-60);
    for(; i<stations.length; i++){
      const s=stations[i]; if(s.x>tramX+60) break;
      if(!s.served && Math.abs(s.x-tramX)<42){ stoppedAt=s; vel=0; doorsOpen=false; doorT=.5; boardT=2.6; break; }
    }
  }
  if(stoppedAt){
    doorT-=dt; if(doorT<=0&&!doorsOpen) doorsOpen=true;
    if(doorsOpen){ boardT-=dt; if(boardT<=0){ pax=Math.max(0,pax-Math.floor(Math.random()*4+1)); pax=Math.min(48,pax+Math.min(stoppedAt.waiting,48-pax)); stoppedAt.waiting=0; stoppedAt.served=true; doorsOpen=false; stoppedAt=null; } }
    if((left||right)&&!doorsOpen){ stoppedAt=null; }
  }

  let ahead=null;
  { let i=lowerBound(stations,tramX); ahead=stations[Math.min(i,stations.length-1)]; }
  destName=ahead?ahead.name:'—';

  camX = tramX - canvas.width*0.36;
  const targetCamY = terrainY(tramX) - canvas.height*0.60;
  camY += (targetCamY-camY)*Math.min(1,dt*4);

  for(const b of birds){ b.x+=b.spd*dt; b.flap+=dt*3; if(b.x-camX>canvas.width+200) b.x-=22000; }

  document.getElementById('h-speed').textContent=Math.round(Math.abs(vel)*0.235/5)*5+' km/h';
  document.getElementById('h-station').textContent='→ '+destName;
  document.getElementById('h-pax').textContent=pax+' Fahrgäste';
  distEl.textContent=(dist/1000).toFixed(2)+' km';
}

const SX = wx => wx - camX;
const SY = wy => wy - camY;
function lowerBound(arr,x){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m].x<x)lo=m+1;else hi=m;} return lo; }

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.drawImage(paper,0,0);

  drawRidge(0.18, 4.1, -260, .12, .55);
  drawRidge(0.42, 1.7, -150, .20, .35);

  // birds
  for(const b of birds){
    const x=SX(b.x), y=SY(b.y); if(x<-40||x>W+40) continue;
    ctx.save(); ctx.globalAlpha=.4; ctx.strokeStyle=INK; ctx.lineWidth=.7; ctx.lineCap='round';
    const f=Math.sin(b.flap)*5;
    ctx.beginPath(); ctx.moveTo(x-7,y+f); ctx.quadraticCurveTo(x-3,y-1,x,y+2); ctx.quadraticCurveTo(x+3,y-1,x+7,y+f); ctx.stroke(); ctx.restore();
  }

  drawGroundLine();

  // scenery
  const x0=camX-260, x1=camX+W+260;
  let i=lowerBound(scenery,x0);
  for(; i<scenery.length; i++){
    const o=scenery[i]; if(o.x>x1) break;
    srand(Math.floor(o.x*7.919+o.h*13));
    drawScenery(o, SX(o.x), SY(terrainY(o.x)));
  }

  drawPoles();

  for(let k=lowerBound(stations,x0); k<stations.length; k++){
    const s=stations[k]; if(s.x>x1) break;
    srand(Math.floor(s.x*3.7));
    drawStation(s);
  }

  drawTrack();
  drawTram();
}

function drawRidge(par,seed,off,fillA,lineA){
  const W=canvas.width,H=canvas.height;
  const pcx=camX*par;
  const baseY=SY(0)*0.22 + H*0.34 + off;
  srand(Math.floor(seed*1000));
  // very faint silhouette with diagonal shade
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-40,H);
  for(let px=-40;px<=W+40;px+=14){ ctx.lineTo(px,baseY+ridgeY(pcx+px,seed)); }
  ctx.lineTo(W+40,H); ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=fillA*.4; ctx.strokeStyle=INK; ctx.lineWidth=.4;
  ctx.beginPath();
  for(let y=baseY-20;y<H;y+=4){ ctx.moveTo(-40,y); ctx.lineTo(W+40,y+W*0.35); }
  ctx.stroke();
  ctx.restore();
  // crest line
  ctx.globalAlpha=lineA; ctx.strokeStyle=INK; ctx.lineWidth=.9; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let px=-40;px<=W+40;px+=10){ const y=baseY+ridgeY(pcx+px,seed); px===-40?ctx.moveTo(px,y):ctx.lineTo(px+rnd(.4),y+rnd(.5)); }
  ctx.stroke();
  ctx.restore();
}

// ground = single confident line + small grass dots, MOSTLY WHITE below
function drawGroundLine(){
  const W=canvas.width,H=canvas.height;
  ctx.save();
  ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha=.85; ctx.lineWidth=1.4;
  ctx.beginPath();
  const step=10, start=Math.floor(camX/step)*step;
  for(let wx=start-step;wx<=camX+W+step;wx+=step){
    srand(wx);
    const px=SX(wx), y=SY(terrainY(wx));
    wx===start-step?ctx.moveTo(px,y):ctx.lineTo(px+rnd(.4),y+rnd(.5));
  }
  ctx.stroke();
  ctx.restore();
}

function drawScenery(o,gx,gy){
  if(gx<-220||gx>canvas.width+220) return;
  if(o.t==='pine')  drawPine(gx,gy,o.h);
  else if(o.t==='tree')  drawTree(gx,gy,o.h);
  else if(o.t==='bush')  drawBush(gx,gy,o.h);
  else if(o.t==='grass') drawGrass(gx,gy,o.h);
  else if(o.t==='house') drawHouse(gx,gy,o.w,o.h);
  else if(o.t==='barn')  drawBarn(gx,gy,o.w,o.h);
}

// conifer — clean triangular silhouette with light diagonal hatch shade on one side
function drawPine(x,gy,h){
  // single clean silhouette
  const top=gy-h, base=h*0.30;
  ctx.save();
  ctx.beginPath();
  // jagged left side
  ctx.moveTo(x,top);
  let layers=6;
  for(let i=1;i<=layers;i++){
    const t=i/layers;
    const w=base*t;
    const yA=top + h*t - h*0.06;
    const yB=top + h*t;
    ctx.lineTo(x-w*0.6, yA);
    ctx.lineTo(x-w*0.35, yA+2);
    ctx.lineTo(x-w, yB);
  }
  ctx.lineTo(x, gy);
  // right side mirror
  for(let i=layers;i>=1;i--){
    const t=i/layers;
    const w=base*t;
    const yA=top + h*t - h*0.06;
    const yB=top + h*t;
    ctx.lineTo(x+w, yB);
    ctx.lineTo(x+w*0.35, yA+2);
    ctx.lineTo(x+w*0.6, yA);
  }
  ctx.closePath();

  // shade on the right side (light)
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.18; ctx.strokeStyle=INK; ctx.lineWidth=.45;
  ctx.beginPath();
  for(let y=top-20;y<gy+10;y+=4){ ctx.moveTo(x,y); ctx.lineTo(x+base*1.4,y+base*0.9); }
  ctx.stroke();
  ctx.restore();

  // crisp outline
  ctx.globalAlpha=.78; ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
  // trunk peeking at bottom
  pl(x,gy,x,gy-2,.5,1.2);
}

// deciduous — cloud silhouette + delicate inner hatch on shadow side, mostly white interior
function drawTree(x,gy,h){
  const trunkH=h*.34;
  pl(x-1,gy,x-1,gy-trunkH,.6,1.4);
  pl(x+2,gy,x+2,gy-trunkH*.8,.4,.9);

  const cy=gy-trunkH-h*.30, R=h*.36;
  // lumpy outline as one closed path
  ctx.save();
  ctx.beginPath();
  const N=18;
  for(let i=0;i<=N;i++){
    const a=(i/N)*Math.PI*2;
    const bump=1 + 0.10*Math.sin(a*3.7+1) + 0.06*Math.sin(a*7.1) + rnd(.04);
    const px=x+Math.cos(a)*R*bump, py=cy+Math.sin(a)*R*0.92*bump;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();

  // inner shadow hatch (right/bottom)
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.16; ctx.strokeStyle=INK; ctx.lineWidth=.45; ctx.lineCap='round';
  ctx.beginPath();
  for(let y=cy-R;y<cy+R+10;y+=4){ ctx.moveTo(x-R*0.2,y); ctx.lineTo(x+R*1.3,y+R); }
  ctx.stroke();
  // sparse little leaf dots
  ctx.globalAlpha=.32;
  for(let k=0;k<12;k++){
    const aa=frand()*Math.PI*2, rr=Math.sqrt(frand())*R*.95;
    const px=x+Math.cos(aa)*rr, py=cy+Math.sin(aa)*rr*.92;
    ctx.beginPath(); ctx.arc(px,py,.6+frand()*.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  ctx.globalAlpha=.82; ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
}

function drawBush(x,gy,h){
  ctx.save();
  ctx.beginPath();
  const N=12, R=h*1.2;
  for(let i=0;i<=N;i++){
    const a=Math.PI + (i/N)*Math.PI; // upper half-ellipse-ish
    const bump=1 + 0.18*Math.sin(a*5+1) + rnd(.06);
    const px=x+Math.cos(a)*R*bump, py=gy+Math.sin(a)*h*0.85*bump;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.lineTo(x+R,gy); ctx.lineTo(x-R,gy); ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.14; ctx.strokeStyle=INK; ctx.lineWidth=.45;
  ctx.beginPath();
  for(let y=gy-h*1.4;y<gy;y+=3){ ctx.moveTo(x-R,y); ctx.lineTo(x+R,y+R*0.7); }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=.7; ctx.strokeStyle=INK; ctx.lineWidth=.9; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
}

function drawGrass(x,gy,h){
  for(let b=0;b<4;b++){
    const bx=x+rnd(9);
    ctx.save(); ctx.globalAlpha=.35+frand()*.15; ctx.strokeStyle=INK; ctx.lineWidth=.55; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,gy);
    ctx.quadraticCurveTo(bx+rnd(2),gy-h*.6,bx+rnd(4),gy-h-frand()*2);
    ctx.stroke(); ctx.restore();
  }
}

// crisp building, white interior, hatch only roof shadow side
function drawHouse(x,gy,w,h){
  // walls outline
  pl(x-w/2,gy,x-w/2,gy-h,.85,1.2);
  pl(x+w/2,gy,x+w/2,gy-h,.85,1.2);
  pl(x-w/2,gy-h,x+w/2,gy-h,.85,1.2);
  // roof
  const peak=h*.5, ro=8;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x-w/2-ro,gy-h);
  ctx.lineTo(x,gy-h-peak);
  ctx.lineTo(x+w/2+ro,gy-h);
  ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.22; ctx.strokeStyle=INK; ctx.lineWidth=.45;
  ctx.beginPath();
  for(let y=gy-h-peak-2;y<gy-h+2;y+=3){ ctx.moveTo(x,y); ctx.lineTo(x+w,y+w*.4); }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=.85; ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();

  // windows (small, dark)
  const ww=10, wh=12;
  const nc=Math.max(1,Math.floor(w/30));
  for(let k=0;k<nc;k++){
    const wx=x-w/2+18+k*(w-30)/Math.max(nc-1,1);
    ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.65;
    ctx.fillRect(wx-ww/2,gy-h*.62,ww,wh);
    ctx.restore();
    ctx.save(); ctx.strokeStyle=INK; ctx.globalAlpha=.85; ctx.lineWidth=.7;
    ctx.strokeRect(wx-ww/2,gy-h*.62,ww,wh); ctx.restore();
  }
  // door
  ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.55;
  ctx.fillRect(x-4,gy-h*.36,8,h*.36); ctx.restore();
  pl(x-4,gy-h*.36,x-4,gy,.7,.9);
  pl(x+4,gy-h*.36,x+4,gy,.7,.9);
  pl(x-4,gy-h*.36,x+4,gy-h*.36,.7,.9);
}

function drawBarn(x,gy,w,h){
  pl(x-w/2,gy,x-w/2,gy-h,.85,1.2);
  pl(x+w/2,gy,x+w/2,gy-h,.85,1.2);
  // gable roof
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x-w/2-4,gy-h);
  ctx.lineTo(x,gy-h-h*.55);
  ctx.lineTo(x+w/2+4,gy-h);
  ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.26; ctx.strokeStyle=INK; ctx.lineWidth=.45;
  ctx.beginPath();
  for(let y=gy-h-h*.6;y<gy-h+2;y+=3){ ctx.moveTo(x,y); ctx.lineTo(x+w,y+w*.4); }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=.85; ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();
  pl(x-w/2,gy-h,x+w/2,gy-h,.85,1.2);

  // vertical plank lines
  for(let k=0;k<5;k++){
    const px=x-w/2+w*(k+1)/6;
    pl(px,gy-h,px,gy,.22,.5);
  }
  // big door
  ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.7;
  ctx.fillRect(x-w*.16,gy-h*.7,w*.32,h*.7); ctx.restore();
  pl(x,gy-h*.7,x,gy,.5,.7);
}

function drawPoles(){
  const W=canvas.width, sp=380;
  const tops=[];
  for(let wx=Math.floor((camX-sp)/sp)*sp; wx<camX+W+sp; wx+=sp){
    const gx=SX(wx), gy=SY(terrainY(wx));
    const top=gy-150;
    pl(gx,gy,gx,top,.7,1);
    pl(gx-13,top+12,gx+13,top+12,.6,.9);
    pl(gx-9,top+22,gx+9,top+22,.45,.7);
    tops.push([gx,top]);
  }
  ctx.save(); ctx.globalAlpha=.4; ctx.strokeStyle=INK; ctx.lineWidth=.55; ctx.lineCap='round';
  for(let k=0;k<tops.length-1;k++){
    const a=tops[k], b=tops[k+1];
    for(const oy of[12,22]){
      ctx.beginPath();
      ctx.moveTo(a[0]-11,a[1]+oy);
      ctx.quadraticCurveTo((a[0]+b[0])/2, Math.max(a[1],b[1])+oy+14, b[0]-11, b[1]+oy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(a[0]+11,a[1]+oy);
      ctx.quadraticCurveTo((a[0]+b[0])/2, Math.max(a[1],b[1])+oy+14, b[0]+11, b[1]+oy);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// simple clean shelter
function drawStation(s){
  const gx=SX(s.x), gy=SY(terrainY(s.x));
  if(gx<-260||gx>canvas.width+260) return;

  const pw=120;
  // platform line (slightly raised)
  pl(gx-pw/2,gy-2,gx+pw/2,gy-2,.75,1.4);
  pl(gx-pw/2,gy-2,gx-pw/2-4,gy+2,.6,.9);
  pl(gx+pw/2,gy-2,gx+pw/2+4,gy+2,.6,.9);

  // shelter
  const sw=80, sh=50, ry=gy-2-sh;
  pl(gx-sw/2,gy-2,gx-sw/2,ry,.85,1.2);
  pl(gx+sw/2,gy-2,gx+sw/2,ry,.85,1.2);
  // shallow roof
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(gx-sw/2-10,ry+2);
  ctx.lineTo(gx,ry-10);
  ctx.lineTo(gx+sw/2+10,ry+2);
  ctx.lineTo(gx+sw/2+10,ry+6);
  ctx.lineTo(gx-sw/2-10,ry+6);
  ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.globalAlpha=.22; ctx.strokeStyle=INK; ctx.lineWidth=.45;
  ctx.beginPath();
  for(let y=ry-12;y<ry+8;y+=3){ ctx.moveTo(gx-sw,y); ctx.lineTo(gx+sw,y+sw*.5); }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=.85; ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  ctx.restore();

  // back panel (filled dark — reads as shelter interior)
  ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.08;
  ctx.fillRect(gx-sw/2+3,ry+8,sw-6,sh*.5); ctx.restore();

  // bench
  pl(gx-18,gy-14,gx+18,gy-14,.7,1.1);
  pl(gx-15,gy-14,gx-15,gy-2,.55,.8);
  pl(gx+15,gy-14,gx+15,gy-2,.55,.8);

  // sign
  ctx.save();
  ctx.strokeStyle=INK; ctx.globalAlpha=.85; ctx.lineWidth=.9;
  ctx.strokeRect(gx-sw/2+6,ry-22,sw-12,14);
  ctx.font='italic 10px Georgia'; ctx.fillStyle=INK; ctx.globalAlpha=.85; ctx.textAlign='center';
  ctx.fillText(s.name,gx,ry-12);
  ctx.restore();

  // waiting people — simple stick figures
  for(let k=0;k<s.waiting;k++) drawPerson(gx-pw/2+18+k*16+rnd(1.5),gy-2,false);
}

function drawPerson(x,y,onboard){
  const h=onboard?14:20;
  ctx.save(); ctx.globalAlpha=.75; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineWidth=.9;
  // head
  ctx.beginPath(); ctx.arc(x,y-h,2.4,0,Math.PI*2); ctx.fillStyle=INK; ctx.globalAlpha=.65; ctx.fill();
  ctx.globalAlpha=.75;
  // body
  ctx.beginPath(); ctx.moveTo(x,y-h+2.4); ctx.lineTo(x,y-h*.4); ctx.stroke();
  // arms
  ctx.beginPath(); ctx.moveTo(x-3.5,y-h*.65); ctx.lineTo(x+3.5,y-h*.65); ctx.stroke();
  // legs
  ctx.beginPath(); ctx.moveTo(x,y-h*.4); ctx.lineTo(x-2.5,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-h*.4); ctx.lineTo(x+2.5,y); ctx.stroke();
  ctx.restore();
}

// rails — two clean parallel lines, sleepers as short ticks
function drawTrack(){
  const W=canvas.width;
  const sp=20, s0=Math.floor((camX-40)/sp)*sp;
  for(let wx=s0; wx<camX+W+40; wx+=sp){
    const gx=SX(wx), gy=SY(terrainY(wx));
    const ang=Math.atan(slopeAt(wx));
    const nx=Math.sin(ang), ny=-Math.cos(ang);
    pl(gx-nx*8,gy+3-ny*8,gx+nx*8,gy+3+ny*8,.55,1.6);
  }
  for(const off of [4,11]){
    ctx.save(); ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.globalAlpha=.7; ctx.lineWidth=1.2;
    ctx.beginPath();
    const step=10, start=Math.floor(camX/step)*step;
    for(let wx=start-step;wx<=camX+W+step;wx+=step){
      const px=SX(wx), y=SY(terrainY(wx))+off;
      wx===start-step?ctx.moveTo(px,y):ctx.lineTo(px,y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// ── Tram ──────────────────────────────────────────────────────────────────────
function drawTram(){
  const gx=SX(tramX), gy=SY(terrainY(tramX));
  const ang=Math.atan(slopeAt(tramX));
  ctx.save();
  ctx.translate(gx,gy);
  ctx.rotate(ang);
  drawDoppel();
  ctx.restore();
}

function drawDoppel(){
  const carL=200, gap=10;
  const half=(carL*2+gap)/2;
  const wheelR=13;
  const bodyBot=-wheelR-7;
  const bodyTop=bodyBot-94;

  const c1L=-half, c1R=-gap/2;
  const c2L= gap/2, c2R= half;

  drawCoupling(c1R,c2L,bodyTop,bodyBot);
  drawCar(c1L,c1R,bodyTop,bodyBot,wheelR,false);
  drawCar(c2L,c2R,bodyTop,bodyBot,wheelR,true);
}

function drawCar(L,R,top,bot,wheelR,cabRight){
  const W=R-L, TH=bot-top;

  // body silhouette path — white interior
  ctx.save();
  carBodyPath(L,R,top,bot,cabRight);
  // clip and fill paper-white so trees behind don't show through window
  ctx.save();
  ctx.fillStyle='#f6f1e3'; ctx.globalAlpha=.98; ctx.fill();
  ctx.restore();
  // outline
  ctx.globalAlpha=.95; ctx.strokeStyle=INK; ctx.lineWidth=1.7; ctx.lineJoin='round'; ctx.lineCap='round';
  carBodyPath(L,R,top,bot,cabRight); ctx.stroke();
  ctx.restore();

  // roof line
  pl(L+8,top+9,R-8,top+9,.6,.8);

  // window band: ONE long dark rectangle (this is what Short Trip does)
  const winTop=top+TH*0.16, winBot=top+TH*0.55;
  const wbL = cabRight ? L+8 : L+W*0.22;
  const wbR = cabRight ? R-W*0.22 : R-8;
  ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.82;
  ctx.fillRect(wbL,winTop,wbR-wbL,winBot-winTop);
  ctx.restore();
  // window mullions (paper colored, like real tram pillars)
  ctx.save(); ctx.fillStyle='#f6f1e3'; ctx.globalAlpha=1;
  const slots=Math.floor((wbR-wbL)/30);
  for(let m=1;m<slots;m++){
    const mxp=wbL+(wbR-wbL)*m/slots;
    ctx.fillRect(mxp-1.4,winTop,2.8,winBot-winTop);
  }
  ctx.restore();
  // window frame outline
  ctx.save(); ctx.strokeStyle=INK; ctx.globalAlpha=.95; ctx.lineWidth=1;
  ctx.strokeRect(wbL,winTop,wbR-wbL,winBot-winTop);
  ctx.restore();

  // doors (3 visible) — narrow dark slots between windows
  const doorPositions = cabRight ? [L+W*0.28, L+W*0.50, L+W*0.72] : [L+W*0.28, L+W*0.50, L+W*0.72];
  for(const dx of doorPositions) drawDoor(dx-9,top+TH*0.14,18,TH*0.74);

  // belt line under windows (chassis line)
  pl(L+6,bot-TH*.14,R-6,bot-TH*.14,.55,.8);
  // skirt fill (light)
  ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.10;
  ctx.fillRect(L+6,bot-TH*.14,W-12,TH*.14);
  ctx.restore();

  // cab
  drawCab(cabRight?R:L, cabRight?1:-1, top, bot, TH);

  // bogies
  drawBogie(L+W*.22,wheelR);
  drawBogie(R-W*.22,wheelR);

  // SSB mark — small italic
  ctx.save(); ctx.globalAlpha=.55; ctx.fillStyle=INK; ctx.font='italic bold 11px Georgia';
  ctx.textAlign=cabRight?'right':'left';
  ctx.fillText('SSB', cabRight? R-W*.16 : L+W*.16, bot-TH*.22);
  ctx.restore();
}

function carBodyPath(L,R,top,bot,cabRight){
  const nose=22, noseRound=12;
  ctx.beginPath();
  if(cabRight){
    ctx.moveTo(L,top+6);
    ctx.quadraticCurveTo(L,top,L+6,top);
    ctx.lineTo(R-nose,top);
    ctx.quadraticCurveTo(R-nose*0.3,top, R, top+noseRound);
    ctx.lineTo(R,bot-noseRound);
    ctx.quadraticCurveTo(R,bot,R-noseRound,bot);
    ctx.lineTo(L+4,bot);
    ctx.quadraticCurveTo(L,bot,L,bot-6);
    ctx.closePath();
  } else {
    ctx.moveTo(L+nose,top);
    ctx.lineTo(R-6,top);
    ctx.quadraticCurveTo(R,top,R,top+6);
    ctx.lineTo(R,bot-6);
    ctx.quadraticCurveTo(R,bot,R-4,bot);
    ctx.lineTo(L+noseRound,bot);
    ctx.quadraticCurveTo(L,bot,L,bot-noseRound);
    ctx.lineTo(L,top+noseRound);
    ctx.quadraticCurveTo(L+nose*0.3,top,L+nose,top);
    ctx.closePath();
  }
}

function drawCab(noseX,dir,top,bot,TH){
  // windshield: angled dark pane near nose
  const wsW=26;
  const wsNear = noseX - dir*4;
  const wsFar  = noseX - dir*(4+wsW);
  const wsL = Math.min(wsNear,wsFar), wsR = Math.max(wsNear,wsFar);
  const wsTop = top+TH*0.16, wsBot = top+TH*0.55;
  ctx.save();
  ctx.fillStyle=INK; ctx.globalAlpha=.82;
  // trapezoid pane
  ctx.beginPath();
  if(dir>0){ // cab on right
    ctx.moveTo(wsR, wsTop+2);
    ctx.lineTo(wsR, wsBot-4);
    ctx.lineTo(wsL, wsBot);
    ctx.lineTo(wsL, wsTop);
  } else {
    ctx.moveTo(wsL, wsTop+2);
    ctx.lineTo(wsL, wsBot-4);
    ctx.lineTo(wsR, wsBot);
    ctx.lineTo(wsR, wsTop);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=INK; ctx.globalAlpha=.9; ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();

  // headlight — small filled disc + ring
  const hlX=noseX-dir*2, hlY=bot-TH*0.18;
  ctx.save();
  ctx.fillStyle=INK; ctx.globalAlpha=.85;
  ctx.beginPath(); ctx.arc(hlX,hlY,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawDoor(dx,dy,dw,dh){
  if(doorsOpen){
    pl(dx,dy,dx,dy+dh,.4,.7);
    pl(dx+dw,dy,dx+dw,dy+dh,.4,.7);
  } else {
    ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.55;
    ctx.fillRect(dx,dy,dw,dh); ctx.restore();
    ctx.save(); ctx.fillStyle='#f6f1e3'; ctx.globalAlpha=1;
    ctx.fillRect(dx+dw/2-1,dy,2,dh); ctx.restore();
    ctx.save(); ctx.strokeStyle=INK; ctx.globalAlpha=.9; ctx.lineWidth=.8;
    ctx.strokeRect(dx,dy,dw,dh); ctx.restore();
  }
}

function drawCoupling(x1,x2,top,bot){
  const cy=(top+bot)/2;
  pl(x1,cy,x2,cy,.7,1.5);
  pl(x1,top+10,x1,bot-4,.4,.7);
  pl(x2,top+10,x2,bot-4,.4,.7);
}

function drawBogie(cx,wr){
  const tr=30;
  // chassis line above wheels
  pl(cx-tr/2-wr,-wr-3,cx+tr/2+wr,-wr-3,.7,1.4);
  for(const wx of [cx-tr/2,cx+tr/2]){
    // wheel — filled dark disc with light center
    ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.92;
    ctx.beginPath(); ctx.arc(wx,0,wr,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.fillStyle='#f6f1e3'; ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(wx,0,wr*.35,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.fillStyle=INK; ctx.globalAlpha=.92;
    ctx.beginPath(); ctx.arc(wx,0,wr*.12,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

requestAnimationFrame(loop);
</script>
</body>
