<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SSB DT 8.12 — Bleistiftskizze</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd8ca; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:'Georgia',serif; }
canvas { display:block; }
#hud { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:32px; color:#333; font-size:12px; letter-spacing:0.1em; opacity:0.6; pointer-events:none; font-style:italic; }
#hud span { border-bottom:1px solid #999; padding-bottom:1px; }
#zone { position:fixed; top:18px; left:50%; transform:translateX(-50%); color:#444; font-size:11px; font-style:italic; letter-spacing:0.15em; opacity:0; transition:opacity 1.8s; pointer-events:none; }
#keys { position:fixed; top:14px; right:18px; color:#aaa; font-size:10px; text-align:right; line-height:1.9; pointer-events:none; font-style:italic; }
#dist { position:fixed; top:14px; left:18px; color:#aaa; font-size:10px; font-style:italic; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="h-speed">0 km/h</span>
  <span id="h-station">→ Hauptbahnhof</span>
  <span id="h-pax">0 Fahrgäste</span>
</div>
<div id="zone"></div>
<div id="keys">← → fahren / bremsen</div>
<div id="dist">0.0 km</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const zoneEl = document.getElementById('zone');
const distEl = document.getElementById('dist');

// ── Paper ─────────────────────────────────────────────────────────────────────
const paper = document.createElement('canvas');
const pctx = paper.getContext('2d');

function buildPaper(){
  paper.width = canvas.width; paper.height = canvas.height;
  pctx.fillStyle='#eae5d6'; pctx.fillRect(0,0,paper.width,paper.height);
  const id=pctx.getImageData(0,0,paper.width,paper.height), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*22;
    d[i]=cl(d[i]+n); d[i+1]=cl(d[i+1]+n*.85); d[i+2]=cl(d[i+2]+n*.65);
  }
  pctx.putImageData(id,0,0);
  for(let y=0;y<paper.height;y+=2+Math.random()*5){
    pctx.globalAlpha=Math.random()*.022; pctx.strokeStyle='#a09070'; pctx.lineWidth=.3;
    pctx.beginPath(); pctx.moveTo(0,y); pctx.lineTo(paper.width,y+(Math.random()-.5)*1.2); pctx.stroke();
  }
}
function cl(v){return Math.max(0,Math.min(255,v));}

function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; buildPaper(); }
resize(); window.addEventListener('resize',resize);

// ── Primitives ────────────────────────────────────────────────────────────────
const INK='#222018', INKM='#504840', INKF='#908878';

function rnd(n){return(Math.random()-.5)*n;}

// Multi-segment wobbly pencil line
function pl(x1,y1,x2,y2,a=.65,w=1,s=4){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1+rnd(.6),y1+rnd(.6));
  for(let i=1;i<=s;i++){ const t=i/s; ctx.lineTo(x1+(x2-x1)*t+rnd(1),y1+(y2-y1)*t+rnd(1)); }
  ctx.stroke();
  ctx.globalAlpha=a*.13; ctx.lineWidth=w*2.2;
  ctx.beginPath(); ctx.moveTo(x1+rnd(.8),y1+rnd(.8)); ctx.lineTo(x2+rnd(.8),y2+rnd(.8)); ctx.stroke();
  ctx.restore();
}

function pr(x,y,w,h,a=.65,lw=1){ pl(x,y,x+w,y,a,lw); pl(x+w,y,x+w,y+h,a,lw); pl(x+w,y+h,x,y+h,a,lw); pl(x,y+h,x,y,a,lw); }

function ht(x,y,w,h,a=.09,sp=6,ang=45){
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineWidth=.4; ctx.lineCap='round';
  ctx.beginPath();
  const r=ang*Math.PI/180, dg=Math.sqrt(w*w+h*h)*1.6;
  for(let d=-dg;d<dg;d+=sp){
    const cx2=x+w/2,cy2=y+h/2;
    const ax=cx2+d*Math.cos(r+Math.PI/2)-dg*Math.cos(r), ay=cy2+d*Math.sin(r+Math.PI/2)-dg*Math.sin(r);
    const bx=cx2+d*Math.cos(r+Math.PI/2)+dg*Math.cos(r), by=cy2+d*Math.sin(r+Math.PI/2)+dg*Math.sin(r);
    const p=clip(ax,ay,bx,by,x,y,x+w,y+h);
    if(p){ ctx.moveTo(p[0]+rnd(.3),p[1]+rnd(.3)); ctx.lineTo(p[2]+rnd(.3),p[3]+rnd(.3)); }
  }
  ctx.stroke(); ctx.restore();
}

function clip(ax,ay,bx,by,x0,y0,x1,y1){
  let t0=0,t1=1; const dx=bx-ax,dy=by-ay;
  for(const[p,q]of[[-dx,ax-x0],[dx,x1-ax],[-dy,ay-y0],[dy,y1-ay]]){
    if(p===0){if(q<0)return null;continue;}
    const r=q/p; if(p<0){if(r>t1)return null;if(r>t0)t0=r;}else{if(r<t0)return null;if(r<t1)t1=r;}
  }
  return[ax+t0*dx,ay+t0*dy,ax+t1*dx,ay+t1*dy];
}

// Wobbly arc via polygon
function pa(cx,cy,rx,ry,a=.65,w=1,n=24){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<=n;i++){ const ang=(i/n)*Math.PI*2; const px=cx+Math.cos(ang)*rx+rnd(1.5),py=cy+Math.sin(ang)*ry+rnd(1.5); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.stroke(); ctx.restore();
}

// Curved path helper (no wobble, for tram body)
function curve(pts,a=.75,w=1.5){
  ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=w; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]+rnd(.5),pts[i][1]+rnd(.5));
  ctx.stroke(); ctx.restore();
}

// ── World ─────────────────────────────────────────────────────────────────────
const GY=()=>Math.round(canvas.height*.73);
let worldX=0,tramX=0,speed=0;
const MAXS=210,ACC=55,BRK=115;
let autobrake=false,doorsOpen=false,doorT=0,boardT=0,pax=0,dist=0;

const stnNames=[
  'Hauptbahnhof','Stadtmitte','Marktplatz','Rathaus','Charlottenplatz',
  'Olgaeck','Österr. Platz','Bubenbad','Bopser','Degerloch',
  'Albstraße','Weinsteige','Ruhbank','Waldau','Dornhaldenstr.',
  'Südheimer Pl.','Möhringen Bf.','Fasanenhof','Messepiazza','Leinfelden',
  'Echterdingen','Flughafen','Plieningen','Heumaden','Sillenbuch',
  'Riedenberg','Steckfeld','Rauher Kapf','Nordbahnhof','Bad Cannstatt',
  'Wilhelmsplatz','Hallschlag','Sommerrain','Mühlhausen','Fellbach',
  'Schmiden','Westbahnhof','Schwabstraße','Vogelsang','Heslach',
  'Kräherwald','Feuersee','Rosenbergpl.','Hölderlinpl.','Bismarckpl.',
  'Eugensplatz','Geroksruhe','Mineralbäder','Berger Stich','Stöckach',
];

const stations=[];
let bx0=700;
for(let i=0;i<300;i++){
  bx0+=850+Math.random()*600;
  stations.push({x:bx0,name:stnNames[i%stnNames.length],waiting:Math.floor(Math.random()*8)+1,served:false,big:Math.random()<.25});
}
let nsi=0,stoppedAt=null;

// Background — many elements, large
const bg=[];
for(let i=0;i<2200;i++){
  const wx=Math.random()*400000, r=Math.random();
  if     (r<.18) bg.push({t:'tree',   wx,l:2,h:120+Math.random()*160});
  else if(r<.36) bg.push({t:'pine',   wx,l:2,h:150+Math.random()*200});
  else if(r<.52) bg.push({t:'house',  wx,l:2,w:130+Math.random()*120,h:100+Math.random()*90});
  else if(r<.62) bg.push({t:'factory',wx,l:2,w:160+Math.random()*120,h:110+Math.random()*70});
  else if(r<.70) bg.push({t:'church', wx,l:2,h:160+Math.random()*100});
  else if(r<.78) bg.push({t:'vine',   wx,l:2,w:200+Math.random()*160,h:80+Math.random()*50});
  else if(r<.86) bg.push({t:'tree',   wx,l:3,h:60+Math.random()*80});
  else if(r<.92) bg.push({t:'pine',   wx,l:3,h:50+Math.random()*70});
  else            bg.push({t:'hill',   wx,l:1,w:600+Math.random()*800,h:130+Math.random()*180});
}
bg.sort((a,b)=>a.l-b.l);

const birds=Array.from({length:12},()=>({wx:Math.random()*15000,wy:40+Math.random()*120,spd:20+Math.random()*45,flap:Math.random()*Math.PI*2}));

const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

const zones=['Stadtmitte','Wohngebiete','Stadtrand','Weinberge','Vorstadt','Waldgebiet','Industrieviertel','Altstadt','Talstation'];
let zoneIdx=0, lastZone='';
let last=0;

function loop(ts){
  const dt=Math.min((ts-last)/1000,.05); last=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const z=zones[Math.floor(tramX/15000)%zones.length];
  if(z!==lastZone){ lastZone=z; zoneEl.textContent=z; zoneEl.style.opacity='.75'; setTimeout(()=>zoneEl.style.opacity='0',2500); }

  while(nsi<stations.length-1&&stations[nsi].served) nsi++;
  const ns=stations[nsi];
  const d=ns.x-tramX;
  const bd=(speed*speed)/(2*BRK)+50;
  autobrake=d<bd+30&&d>-20&&!stoppedAt;

  if(d<=0&&!stoppedAt&&speed<5){ speed=0; stoppedAt=ns; doorsOpen=false; doorT=.5; boardT=3; }
  if(stoppedAt){
    doorT-=dt; if(doorT<=0&&!doorsOpen) doorsOpen=true;
    if(doorsOpen){ boardT-=dt; if(boardT<=0){ pax=Math.max(0,pax-Math.floor(Math.random()*4+1)); pax=Math.min(40,pax+Math.min(stoppedAt.waiting,40-pax)); stoppedAt.waiting=0; stoppedAt.served=true; stoppedAt=null; doorsOpen=false; } }
  }
  if(!stoppedAt){
    if((keys.ArrowRight||keys.KeyD)&&!autobrake) speed=Math.min(MAXS,speed+ACC*dt);
    else if(keys.ArrowLeft||keys.KeyA) speed=Math.max(0,speed-BRK*dt);
    else if(autobrake) speed=Math.max(0,speed-BRK*dt);
    else speed=Math.min(MAXS*.5,speed+ACC*.25*dt);
  }
  tramX+=speed*dt; dist+=speed*dt;
  worldX=tramX-canvas.width*.3;
  for(const b of birds){ b.wx+=b.spd*dt; b.flap+=dt*3; if(b.wx-worldX*.08>canvas.width+200) b.wx-=18000; }

  document.getElementById('h-speed').textContent=Math.round(speed*3.6/10)*10+' km/h';
  document.getElementById('h-station').textContent='→ '+ns.name+(d<300?' ·':'');
  document.getElementById('h-pax').textContent=pax+' Fahrgäste';
  distEl.textContent=(dist/1000).toFixed(1)+' km';
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  const W=canvas.width,H=canvas.height,GY_=GY();
  ctx.drawImage(paper,0,0);

  // Very faint sky wash — just slightly different from paper
  ctx.save(); ctx.globalAlpha=.07;
  const sg=ctx.createLinearGradient(0,0,0,GY_);
  sg.addColorStop(0,'#bbb'); sg.addColorStop(1,'#e0ddd5');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,GY_); ctx.restore();

  // Layer 1: far hills
  for(const o of bg){ if(o.l!==1)continue; const sx=o.wx-worldX*.05; if(sx<-700||sx>W+700)continue; ctx.save(); ctx.globalAlpha=.10; drawHill(sx,GY_-20,o.w,o.h); ctx.restore(); }

  // Layer 2: mid
  for(const o of bg){ if(o.l!==2)continue; const sx=o.wx-worldX*.22; if(sx<-300||sx>W+300)continue;
    ctx.save(); ctx.globalAlpha=.58;
    if(o.t==='tree')    drawTree(sx,GY_-10,o.h);
    if(o.t==='pine')    drawPine(sx,GY_-10,o.h);
    if(o.t==='house')   drawHouse(sx,GY_-10,o.w,o.h);
    if(o.t==='factory') drawFactory(sx,GY_-10,o.w,o.h);
    if(o.t==='church')  drawChurch(sx,GY_-10,o.h);
    if(o.t==='vine')    drawVine(sx,GY_-10,o.w,o.h);
    ctx.restore();
  }

  // Layer 3: near trees
  for(const o of bg){ if(o.l!==3)continue; const sx=o.wx-worldX*.72; if(sx<-100||sx>W+100)continue;
    ctx.save(); ctx.globalAlpha=.88;
    if(o.t==='tree') drawTree(sx,GY_+4,o.h);
    if(o.t==='pine') drawPine(sx,GY_+4,o.h);
    ctx.restore();
  }

  // Birds
  for(const b of birds){
    const bx=b.wx-worldX*.08; if(bx<-40||bx>W+40)continue;
    ctx.save(); ctx.globalAlpha=.28; ctx.strokeStyle=INK; ctx.lineWidth=.8; ctx.lineCap='round';
    const f=Math.sin(b.flap)*5;
    ctx.beginPath(); ctx.moveTo(bx-9,b.wy+f); ctx.quadraticCurveTo(bx-4,b.wy,bx,b.wy+2); ctx.quadraticCurveTo(bx+4,b.wy,bx+9,b.wy+f); ctx.stroke(); ctx.restore();
  }

  // Ground fill
  ctx.save(); ctx.globalAlpha=.06;
  const gg=ctx.createLinearGradient(0,GY_,0,H);
  gg.addColorStop(0,'#777'); gg.addColorStop(1,'#444');
  ctx.fillStyle=gg; ctx.fillRect(0,GY_,W,H-GY_); ctx.restore();
  ht(0,GY_,W,H-GY_,.055,10,28);
  ht(0,GY_,W,(H-GY_)*.35,.04,16,115);

  // Ground line
  pl(0,GY_,W,GY_,.55,1.6,12);

  // Grass tufts
  const tsp=42,tof=worldX%tsp;
  for(let tx=-tof;tx<W+tsp;tx+=tsp){
    const gx=tx+rnd(6);
    for(let b2=0;b2<4;b2++){ const bx2=gx+rnd(8); pl(bx2,GY_,bx2+rnd(3)-1,GY_-7-Math.random()*8,.18,.4,2); }
  }

  // Track
  drawTrack(GY_);
  // Overhead
  drawOverhead(GY_);
  // Stations
  for(const s of stations){ const sx=s.x-worldX; if(sx<-300||sx>W+300)continue; drawStation(s,GY_); }
  // Tram
  drawDT812(tramX-worldX,GY_);

  // Vignette
  ctx.save();
  const v=ctx.createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H*.88);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(18,14,8,.32)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H); ctx.restore();
}

// ── Scenery ───────────────────────────────────────────────────────────────────
function drawHill(x,gy,w,h){
  ctx.strokeStyle=INKF; ctx.lineWidth=.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-w/2+rnd(5),gy+rnd(3));
  ctx.bezierCurveTo(x-w*.25+rnd(15),gy-h*.75+rnd(12),x+w*.2+rnd(15),gy-h+rnd(14),x+w/2+rnd(5),gy+rnd(3));
  ctx.stroke(); ht(x-w/2,gy-h,w,h,.04,18,20);
}

function drawTree(x,gy,h){
  // trunk — double line for thickness
  pl(x-3,gy,x-2,gy-h*.38,.72,1.8);
  pl(x+3,gy,x+2,gy-h*.38,.58,1.1);
  // canopy outline
  const cy=gy-h*.38-h*.34, rx=h*.35,ry=h*.36;
  pa(x,cy,rx,ry,.68,1.4,26);
  // inner foliage scribble — many short strokes
  for(let s=0;s<12;s++){
    const a=Math.random()*Math.PI*2, r2=Math.random()*rx*.75;
    pl(x+Math.cos(a)*r2,cy+Math.sin(a)*ry*.75,x+Math.cos(a+.5)*r2*.5,cy+Math.sin(a+.5)*ry*.5,.14,.6,1);
  }
  // root flare
  pl(x-3,gy,x-9,gy+2,.35,.8,1);
  pl(x+3,gy,x+9,gy+2,.35,.8,1);
}

function drawPine(x,gy,h){
  pl(x,gy,x,gy-h,.72,1.5);
  pl(x+2,gy,x+1,gy-h,.4,.7);
  for(let i=0;i<7;i++){
    const t=i/7, ly=gy-h*(.08+t*.86), lw=h*(.28-t*.18);
    pl(x-lw+rnd(2),ly+h*.05+rnd(1.5),x+rnd(2.5),ly-h*.11+rnd(2.5),.60,1.1,3);
    pl(x+lw+rnd(2),ly+h*.05+rnd(1.5),x+rnd(2.5),ly-h*.11+rnd(2.5),.60,1.1,3);
    // layering detail
    if(i>1){ pl(x-lw*.6,ly,x-lw*.2,ly-h*.06,.2,.5,1); pl(x+lw*.6,ly,x+lw*.2,ly-h*.06,.2,.5,1); }
  }
}

function drawHouse(x,gy,w,h){
  ht(x-w/2,gy-h,w,h,.06,10,90);
  ht(x-w/2,gy-h,w,h,.03,10,0);
  pr(x-w/2,gy-h,w,h,.68,1.1);
  // roof
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.3; ctx.globalAlpha=.68; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-w/2-7+rnd(1),gy-h+rnd(1));
  ctx.lineTo(x+rnd(3),gy-h-h*.55+rnd(4));
  ctx.lineTo(x+w/2+7+rnd(1),gy-h+rnd(1));
  ctx.stroke(); ctx.restore();
  ht(x-w/2-7,gy-h-h*.55,w+14,h*.55,.08,5,130);
  // gutter
  pl(x-w/2-7,gy-h,x+w/2+7,gy-h,.45,1.3,6);
  // chimney
  if(Math.random()>.4){ const cx2=x+w*.25; pr(cx2-8,gy-h-h*.5,16,h*.3,.6,.9); ht(cx2-8,gy-h-h*.5,16,h*.3,.08,5,90); }
  // windows
  const nc=Math.max(1,Math.floor(w/30));
  for(let i=0;i<nc;i++){
    const wx=x-w/2+16+i*(w-28)/(Math.max(nc-1,1));
    pr(wx-8+rnd(.5),gy-h*.65+rnd(.5),16,13,.55,.8);
    pl(wx,gy-h*.65,wx,gy-h*.65+13,.25,.5);
    pl(wx-8,gy-h*.65+6.5,wx+8,gy-h*.65+6.5,.25,.5);
  }
  pr(x-5,gy-h*.42,10,h*.42,.50,.8);
}

function drawFactory(x,gy,w,h){
  ht(x-w/2,gy-h,w,h,.065,9,90);
  pr(x-w/2,gy-h,w,h,.68,1.1);
  // chimneys (2)
  for(const cx2 of[x-w*.25,x+w*.1]){
    pr(cx2-10,gy-h-45,20,45,.65,1); ht(cx2-10,gy-h-45,20,45,.09,5,90);
    for(let s=0;s<4;s++){ ctx.save(); ctx.globalAlpha=.05+s*.015; ctx.strokeStyle=INKF; ctx.lineWidth=.5; ctx.beginPath(); ctx.ellipse(cx2+rnd(3),gy-h-46-s*12-rnd(3),5+s*2.5,4+s*2,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  }
  // industrial windows
  const nc=Math.max(2,Math.floor(w/28));
  for(let i=0;i<nc;i++){
    const wx=x-w/2+18+i*(w-32)/(Math.max(nc-1,1));
    pr(wx-7,gy-h*.62,14,18,.48,.7); pl(wx,gy-h*.62,wx,gy-h*.62+18,.22,.5);
  }
}

function drawChurch(x,gy,h){
  const w=h*.5;
  ht(x-w/2,gy-h*.68,w,h*.68,.06,9,90);
  pr(x-w/2,gy-h*.68,w,h*.68,.65,.95);
  pl(x-w/2-6,gy-h*.68,x+w/2+6,gy-h*.68,.52,1.2,4);
  // tower
  pr(x-12,gy-h,24,h,.65,.95); ht(x-12,gy-h,24,h,.07,5,90);
  // spire
  pl(x-13,gy-h,x,gy-h-h*.48,.68,1.1,3); pl(x+13,gy-h,x,gy-h-h*.48,.68,1.1,3);
  pl(x-13,gy-h,x+13,gy-h,.55,1,2);
  // cross
  pl(x,gy-h-h*.38,x,gy-h-h*.16,.62,1.2); pl(x-8,gy-h-h*.30,x+8,gy-h-h*.30,.62,1.2);
  // rose window
  pa(x,gy-h*.85,11,11,.48,.8,14);
  // arched windows
  for(const wx of[x-w/2+18,x+w/2-18]){ pr(wx-7,gy-h*.52,14,16,.45,.7); ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=.7; ctx.globalAlpha=.42; ctx.beginPath(); ctx.arc(wx,gy-h*.52,7,Math.PI,0); ctx.stroke(); ctx.restore(); }
}

function drawVine(x,gy,w,h){
  for(let r=0;r<6;r++){
    const ry=gy-(r+.5)*(h/6);
    pl(x-w/2,ry,x+w/2,ry,.20,.5,7);
    const posts=Math.floor(w/20);
    for(let p=0;p<posts;p++){ const px=x-w/2+p*(w/posts)+rnd(2); pl(px,ry,px,ry-h/6*.7,.18,.5,1); }
  }
  pl(x-w/2,gy,x-w/2,gy-h,.18,.5); pl(x+w/2,gy,x+w/2,gy-h,.18,.5);
}

// ── Track ─────────────────────────────────────────────────────────────────────
function drawTrack(gy){
  const W=canvas.width, ry=gy+3, g=16;
  const ss=20,so=worldX%ss;
  for(let tx=-so;tx<W+ss;tx+=ss) pl(tx+rnd(.4),ry-g-2,tx+rnd(.4),ry+g+2,.30,3,1);
  pl(-10,ry-g/2,W+10,ry-g/2,.70,1.6,16);
  pl(-10,ry+g/2,W+10,ry+g/2,.70,1.6,16);
  // rail shine
  pl(-10,ry-g/2-1,W+10,ry-g/2-1,.12,.4,10);
  pl(-10,ry+g/2-1,W+10,ry+g/2-1,.12,.4,10);
}

// ── Overhead ──────────────────────────────────────────────────────────────────
function drawOverhead(gy){
  const W=canvas.width, wireY=gy-100, ps=175, off=worldX%ps;
  for(let px=-off;px<W+ps;px+=ps){
    // pole
    pl(px+rnd(.5),gy+3,px+rnd(.5),wireY+2,.44,1.3);
    // arm
    pl(px,wireY+2,px-25,wireY-8,.38,.9); pl(px-25,wireY-8,px-25,wireY+5,.30,.7);
    // brace
    pl(px-25,wireY-8,px-10,wireY-16,.24,.55); pl(px-10,wireY-16,px,wireY-2,.20,.5);
    // insulator
    ctx.save(); ctx.globalAlpha=.32; ctx.strokeStyle=INK; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.arc(px-25,wireY-8,2.5,0,Math.PI*2); ctx.stroke(); ctx.restore();
    // crossbar
    pl(px-30,wireY-8,px-20,wireY-8,.25,.5,2);
  }
  // wire
  ctx.save(); ctx.strokeStyle=INKM; ctx.lineWidth=.7; ctx.globalAlpha=.38; ctx.lineCap='round';
  ctx.beginPath();
  for(let px=-off;px<W+ps;px+=ps){
    ctx.moveTo(px+rnd(.5),wireY+rnd(.5));
    ctx.quadraticCurveTo(px+ps/2+rnd(5),wireY+11+rnd(2),px+ps+rnd(.5),wireY+rnd(.5));
  }
  ctx.stroke(); ctx.restore();
  // hangers
  for(let px=-off;px<W+ps;px+=ps){
    for(let h2=0;h2<3;h2++){ const hx=px+ps/4+h2*ps/4; pl(hx,wireY+3,hx,wireY+10,.18,.5,1); }
  }
}

// ── Station ───────────────────────────────────────────────────────────────────
function drawStation(s,gy){
  const sx=s.x-worldX, pw=s.big?160:115, ph=12;
  // platform — stone texture
  ht(sx-pw/2,gy-ph,pw,ph,.12,4,0); ht(sx-pw/2,gy-ph,pw,ph,.06,4,90);
  pr(sx-pw/2,gy-ph,pw,ph,.65,1.4);
  // horizontal stone joints
  for(let r=1;r<3;r++) pl(sx-pw/2,gy-ph+r*(ph/3),sx+pw/2,gy-ph+r*(ph/3),.20,.5,5);

  const sh=s.big?90:65, sw=s.big?90:65;
  const ry=gy-ph-sh;
  // columns
  const cols=s.big?3:2;
  for(let c=0;c<cols;c++){
    const cx2=sx-sw/2+c*(sw/(cols-1));
    pl(cx2,gy-ph,cx2,ry,.60,1.2);
    // column base
    pl(cx2-6,gy-ph,cx2+6,gy-ph,.45,1.8,2);
    // capital
    pl(cx2-8,ry,cx2+8,ry,.45,1.8,2);
  }
  // main beam
  pl(sx-sw/2-8,ry,sx+sw/2+8,ry,.68,1.8,5);
  // roof overhang
  pl(sx-sw/2-14,ry,sx-sw/2-22,ry-12,.52,1);
  pl(sx+sw/2+14,ry,sx+sw/2+22,ry-12,.52,1);
  pl(sx-sw/2-22,ry-12,sx+sw/2+22,ry-12,.45,.9,5);
  ht(sx-sw/2-22,ry-12,sw+44,12,.08,5,130);
  // roof tiles
  const tiles=Math.floor((sw+44)/12);
  for(let t=0;t<tiles;t++){
    const tx=sx-sw/2-22+t*12;
    ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=.5; ctx.globalAlpha=.2;
    ctx.beginPath(); ctx.arc(tx+6,ry-12,6,0,Math.PI,true); ctx.stroke(); ctx.restore();
  }
  // back wall
  pr(sx-sw/2,ry,sw,sh*.55,.18,.6);

  // name board
  pr(sx-sw/2+2,ry-22,sw-4,16,.38,.7);
  ctx.save(); ctx.font=`italic ${Math.max(9,10)}px Georgia`; ctx.fillStyle=INK; ctx.globalAlpha=.68; ctx.textAlign='center';
  ctx.fillText(s.name,sx,ry-10); ctx.restore();

  // people
  for(let i=0;i<s.waiting;i++) drawPerson(sx-pw/2+14+i*15+rnd(3),gy-ph,false);
}

// ── Person ────────────────────────────────────────────────────────────────────
function drawPerson(x,y,onboard){
  const h=onboard?18:26, a=onboard?.50:.62;
  ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineWidth=.9;
  ctx.beginPath(); ctx.arc(x+rnd(.5),y-h+rnd(.5),3.5,0,Math.PI*2); ctx.stroke();
  pl(x,y-h+4,x+rnd(1.5),y-h*.38,a,1,2);
  pl(x-5,y-h*.56,x+5,y-h*.56+rnd(1.5),a,.85,1);
  pl(x,y-h*.38,x-4+rnd(1.5),y,a,1,2);
  pl(x,y-h*.38,x+4+rnd(1.5),y,a,1,2);
  ctx.restore();
}

// ── DT 8.12 Stadler Tango ─────────────────────────────────────────────────────
// Based on photo: 3-section, distinctive rounded wedge nose, large windows,
// characteristic oval/pill door panels, rounded roof profile
function drawDT812(cx,gy){
  // Scale tram to be LARGE — about 38% of screen height tall
  const TH=Math.round(canvas.height*.38);
  const TW=Math.round(TH*5.8);  // real tram ~3× longer than tall
  const ty=gy-TH;               // top of tram body
  const rx=gy+3;                 // rail Y
  const left=cx-TW/2;

  ctx.save();

  // ── Ground shadow ──
  ht(left+20,gy+2,TW-40,8,.07,3,0);

  // ── Body fill — very faint ──
  ctx.save(); ctx.globalAlpha=.08; ctx.fillStyle='#ccc'; ctx.fillRect(left,ty,TW,TH); ctx.restore();

  // ── The DT 8.12 has 3 sections: front cab + mid passenger + rear cab ──
  // approx widths: front=TW*.28, mid=TW*.44, rear=TW*.28
  const fW=Math.round(TW*.28), mW=Math.round(TW*.44), rW=TW-fW-mW;
  const fX=left, mX=left+fW, rX=left+fW+mW;

  // ── Roof profile — rounded top ──
  // The Tango has a slightly curved/crowned roof
  drawRoofProfile(left,ty,TW,TH);

  // ── Undercarriage / skirting ──
  const skirtH=Math.round(TH*.16);
  ht(left,gy-skirtH,TW,skirtH,.07,6,90);
  pl(left+fW*.18,gy-skirtH,left+TW-rW*.18,gy-skirtH,.45,1.2,12);

  // ── Windows + body sections ──
  drawFrontCab(fX,ty,fW,TH,false);
  drawMidSection(mX,ty,mW,TH);
  drawFrontCab(rX,ty,rW,TH,true); // mirrored

  // ── Articulation joints ──
  drawJoint(mX,ty,TH);
  drawJoint(rX,ty,TH);

  // ── Body outline — drawn after everything ──
  // Top body line
  pl(left+Math.round(fW*.18),ty,left+TW-Math.round(rW*.18),ty,.82,2,18);
  // Bottom body line
  pl(left+Math.round(fW*.1),gy-skirtH,left+TW-Math.round(rW*.1),gy-skirtH,.72,1.5,14);
  // Waist stripe (characteristic Tango detail)
  pl(left+Math.round(fW*.2),ty+Math.round(TH*.52),left+TW-Math.round(rW*.2),ty+Math.round(TH*.52),.25,.8,14);
  // Roof edge
  pl(left+Math.round(fW*.15),ty,left+TW-Math.round(rW*.15),ty,.38,3,12); // thick top edge

  // ── Pantographs — 2 on roof ──
  drawPanto(left+fW+mW*.28,ty,gy-100);
  drawPanto(left+fW+mW*.72,ty,gy-100);

  // ── Bogies — 4 bogies ──
  drawBogie(left+fW*.28,rx,TH);
  drawBogie(left+fW*.82,rx,TH);
  drawBogie(left+fW+mW+rW*.18,rx,TH);
  drawBogie(left+fW+mW+rW*.72,rx,TH);

  // ── "SSB" lettering on rear ──
  ctx.save();
  ctx.font=`bold ${Math.round(TH*.09)}px Georgia`; ctx.fillStyle=INK;
  ctx.globalAlpha=.42; ctx.textAlign='right';
  ctx.fillText('SSB',left+TW-Math.round(rW*.12),ty+Math.round(TH*.80));
  // unit number
  ctx.font=`${Math.round(TH*.055)}px Georgia`; ctx.globalAlpha=.30;
  ctx.fillText('3503',left+TW-Math.round(rW*.12),ty+Math.round(TH*.68));
  ctx.restore();

  ctx.restore();
}

function drawRoofProfile(left,ty,TW,TH){
  // Slightly crowned roof — draw outline path
  const roofH=Math.round(TH*.08);
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.globalAlpha=.72; ctx.lineCap='round';
  // top roof strip (HVAC units etc.)
  ht(left+TW*.12,ty-roofH,TW*.76,roofH,.06,5,0);
  pr(left+TW*.12,ty-roofH,TW*.76,roofH,.30,1);
  // HVAC boxes
  for(const bx of[left+TW*.22,left+TW*.50,left+TW*.70]){
    pr(bx,ty-roofH*.7,TW*.06,roofH*.5,.30,.7);
    ht(bx,ty-roofH*.7,TW*.06,roofH*.5,.07,4,90);
  }
  ctx.restore();
}

function drawFrontCab(sx,ty,sw,TH,mirrored){
  // The DT 8.12 nose: characteristic wedge/chamfer shape
  // - Upper portion: large angled windshield
  // - Lower: tapered apron/cowl
  // - Headlights at lower corners
  // - Destination display at top

  const d=mirrored?-1:1;
  const noseW=Math.round(sw*.22); // how far the nose tapers

  // ── Nose shape ──
  // We draw the nose as a polygon of key points:
  const nX=mirrored?sx+sw:sx; // outermost nose X
  const nTip=nX+d*noseW;       // widest body point X (toward center)
  const apronY=ty+Math.round(TH*.88);
  const cowlY=ty+Math.round(TH*.55);

  // Apron bottom edge (angled)
  pl(nX+d*8,apronY+5,nTip,apronY+3,.70,1.5,3);
  // Lower cowl line
  pl(nX,cowlY,nX+d*6,apronY+5,.70,1.5,3);
  // Upper body line (top of nose to top of windshield area)
  pl(nX+d*2,ty+6,nTip,ty,.78,2,4);
  // Vertical nose face (near front)
  pl(nX+d*2,ty+6,nX,cowlY,.68,1.8,4);

  // Hatching on nose face
  ht(Math.min(nX,nTip),ty,Math.abs(nTip-nX),TH*.55,.055,8,mirrored?-50:50);

  // ── Windshield ──
  const wsLeft=mirrored?nX-d*noseW*1.3:nX+d*noseW*.05;
  const wsRight=mirrored?nX-d*noseW*.05:nX+d*noseW*1.3;
  const wsTop=ty+Math.round(TH*.06);
  const wsBot=ty+Math.round(TH*.48);
  const wsW=Math.abs(wsRight-wsLeft);
  const wsX=Math.min(wsLeft,wsRight);
  // fill
  ctx.save(); ctx.globalAlpha=.06; ctx.fillStyle='#9bbccc'; ctx.fillRect(wsX,wsTop,wsW,wsBot-wsTop); ctx.restore();
  // outline — slightly angled bottom
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.globalAlpha=.75; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(wsX+rnd(.5),wsTop+rnd(.5));
  ctx.lineTo(wsX+wsW+rnd(.5),wsTop+rnd(.5));
  ctx.lineTo(wsX+wsW+rnd(.5),wsBot+rnd(.5));
  ctx.lineTo(wsX+rnd(.5),wsBot+rnd(.5));
  ctx.closePath(); ctx.stroke(); ctx.restore();
  // center divider
  pl(wsX+wsW/2,wsTop,wsX+wsW/2,wsBot,.35,.8,3);
  // wiper
  pl(wsX+wsW*.5-d*wsW*.05,wsBot-4,wsX+wsW*.5+d*wsW*.35,wsTop+6,.18,.6,2);

  // ── Destination display — top of cab ──
  const ddX=mirrored?nX-d*noseW*1.8:nX+d*noseW*.2;
  const ddW=Math.round(sw*.55);
  const ddH=Math.round(TH*.09);
  pr(Math.min(ddX,ddX+ddW),ty+3,Math.abs(ddW),ddH,.55,.9);
  ht(Math.min(ddX,ddX+ddW),ty+3,Math.abs(ddW),ddH,.05,3,0);
  ctx.save();
  ctx.font=`bold ${Math.round(TH*.055)}px Georgia`; ctx.fillStyle=INK;
  ctx.globalAlpha=.50; ctx.textAlign='center';
  const ns2=stations[nsi];
  ctx.fillText((ns2?ns2.name:'—').substring(0,9),Math.min(ddX,ddX+ddW)+Math.abs(ddW)/2,ty+3+ddH*.75);
  ctx.restore();

  // ── Headlights — characteristic DT 8.12 round clusters ──
  const hlY=ty+Math.round(TH*.70);
  const hlX=mirrored?nX-d*5:nX+d*5;
  // main headlight (circle)
  pa(hlX,hlY,Math.round(TH*.038),Math.round(TH*.038),.60,1.2,14);
  // inner bright dot
  pa(hlX,hlY,Math.round(TH*.015),Math.round(TH*.015),.30,.7,10);
  // indicator
  pa(hlX,hlY+Math.round(TH*.07),Math.round(TH*.022),Math.round(TH*.018),.48,1,10);

  // ── Door on cab section (1 door, inboard side) ──
  const doorX=mirrored?nX-d*noseW*1.6:nX+d*noseW*1.5;
  const doorW2=Math.round(sw*.28), doorH=Math.round(TH*.68);
  const doorY=ty+Math.round(TH*.20);
  drawDoor(doorX-(mirrored?doorW2:0),doorY,doorW2,doorH);

  // ── Coupling / buffer at nose ──
  pl(nX,ty+Math.round(TH*.92),nX+d*5,ty+Math.round(TH*.92),.55,2);
  pl(nX+d*5,ty+Math.round(TH*.85),nX+d*5,ty+Math.round(TH*.98),.45,3);
  // coupler box
  pr(Math.min(nX,nX+d*10),ty+Math.round(TH*.87),10,Math.round(TH*.10),.45,.8);

  // ── Vehicle number on nose ──
  ctx.save();
  ctx.font=`${Math.round(TH*.042)}px Georgia`; ctx.fillStyle=INK; ctx.globalAlpha=.28;
  ctx.textAlign=mirrored?'right':'left';
  ctx.fillText('15 05',mirrored?nX-d*5:nX+d*5,ty+Math.round(TH*.40));
  ctx.restore();
}

function drawMidSection(sx,ty,sw,TH){
  // Mid passenger section of DT 8.12:
  // - Large continuous window band (very characteristic)
  // - 4 doors (2 per side, but we see one side) — large oval/pill shaped door panels
  // - Low-floor profile

  const winY=ty+Math.round(TH*.10);
  const winH=Math.round(TH*.60);

  // ── Big window band ──
  ctx.save(); ctx.globalAlpha=.06; ctx.fillStyle='#9bbccc';
  ctx.fillRect(sx,winY,sw,winH); ctx.restore();

  // Window band outline (top and bottom rails)
  pl(sx,winY,sx+sw,winY,.62,1.3,10);
  pl(sx,winY+winH,sx+sw,winY+winH,.62,1.3,10);

  // Window mullions — evenly spaced verticals
  const mullions=6;
  for(let m=1;m<mullions;m++){
    const mx=sx+m*(sw/mullions);
    pl(mx,winY,mx,winY+winH,.28,.7,2);
  }

  // ── 4 door panels — the iconic oval/pill shape of DT 8.12 ──
  const doorPositions=[sx+sw*.10, sx+sw*.32, sx+sw*.58, sx+sw*.80];
  for(const dx of doorPositions) drawDoor(dx,ty+Math.round(TH*.18),Math.round(sw*.14),Math.round(TH*.70));

  // ── Passengers visible through windows ──
  const paxSlots=Math.floor(sw/28);
  for(let p=0;p<paxSlots;p++){
    if(p<pax/3) drawPerson(sx+14+p*28,winY+winH-2,true);
  }
}

function drawDoor(dx,dy,dw,dh){
  if(doorsOpen){
    // Open: draw two leaves sliding apart (visible gap)
    pl(dx-dw*.3,dy,dx-dw*.3,dy+dh*.15,.52,1.1);
    pl(dx+dw+dw*.3,dy,dx+dw+dw*.3,dy+dh*.15,.52,1.1);
    // gap hatching
    ht(dx,dy,dw,dh,.03,5,90);
  } else {
    // Closed door — the DT 8.12 doors are characteristic:
    // Dark oval/pill shaped panels with thin gap in center
    ht(dx,dy,dw,dh,.08,6,90);
    pr(dx+rnd(.3),dy+rnd(.3),dw,dh,.65,1.1);
    // center split line
    pl(dx+dw/2,dy+2,dx+dw/2,dy+dh-2,.40,.8,3);
    // oval door grab bar
    ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=.7; ctx.globalAlpha=.35;
    ctx.beginPath(); ctx.arc(dx+dw/2,dy+dh*.5,Math.round(dw*.08),0,Math.PI*2); ctx.stroke();
    ctx.restore();
    // door hinge marks
    pl(dx+dw*.08,dy+dh*.15,dx+dw*.08,dy+dh*.85,.20,.5);
    pl(dx+dw*.92,dy+dh*.15,dx+dw*.92,dy+dh*.85,.20,.5);
  }
}

function drawJoint(x,ty,TH){
  // Bellows / articulation
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=.8; ctx.globalAlpha=.50;
  const jw=Math.round(TH*.06), jx=x-jw/2;
  for(let z=0;z<5;z++){
    const zy=ty+TH*.12+z*(TH*.72/5);
    pl(jx,zy,jx+jw,zy+TH*.12/5,.40,.7,1);
    pl(jx+jw,zy+TH*.12/5,jx,zy+TH*.24/5,.40,.7,1);
  }
  // rubber seal marks
  pl(jx,ty+TH*.12,jx,ty+TH*.84,.25,.6,3);
  pl(jx+jw,ty+TH*.12,jx+jw,ty+TH*.84,.25,.6,3);
  ctx.restore();
}

function drawPanto(cx,ty,wireY){
  const pw=Math.round(Math.abs(ty-wireY)*.45);
  pl(cx-pw,ty,cx-pw*.2,ty-Math.abs(ty-wireY)*.35,.65,1.2);
  pl(cx+pw,ty,cx+pw*.2,ty-Math.abs(ty-wireY)*.35,.65,1.2);
  pl(cx-pw*.2,ty-Math.abs(ty-wireY)*.35,cx+pw*.2,ty-Math.abs(ty-wireY)*.35,.72,1.5);
  pl(cx-pw,ty,cx+pw,ty,.48,1,2); // base
  pl(cx,ty-Math.abs(ty-wireY)*.35,cx+rnd(2),wireY+2,.32,.7);
}

function drawBogie(cx,ry,TH){
  const wr=Math.round(TH*.075); // wheel radius
  const track=Math.round(TH*.18);
  ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.globalAlpha=.78; ctx.lineCap='round';
  // bogie frame
  pl(cx-track/2-wr,ry,cx+track/2+wr,ry,.42,2,4);
  // side frames
  pl(cx-track/2-wr,ry-wr*.6,cx-track/2-wr,ry+wr*.3,.38,1.2,2);
  pl(cx+track/2+wr,ry-wr*.6,cx+track/2+wr,ry+wr*.3,.38,1.2,2);
  // wheels
  for(const wx of[cx-track/2,cx+track/2]){
    ctx.beginPath(); ctx.arc(wx+rnd(.4),ry,wr,0,Math.PI*2); ctx.stroke();
    // spokes
    for(let s=0;s<4;s++){ const a=s*Math.PI/4; pl(wx+Math.cos(a)*wr*.65,ry+Math.sin(a)*wr*.65,wx+Math.cos(a+Math.PI)*wr*.65,ry+Math.sin(a+Math.PI)*wr*.65,.22,.55,1); }
    // hub
    ctx.save(); ctx.globalAlpha=.38; ctx.beginPath(); ctx.arc(wx,ry,wr*.22,0,Math.PI*2); ctx.stroke(); ctx.restore();
    // flange
    ctx.save(); ctx.lineWidth=2.5; ctx.globalAlpha=.35; ctx.beginPath(); ctx.arc(wx,ry,wr+1,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  // spring detail
  for(const wx of[cx-track/2,cx+track/2]){
    for(let s=0;s<3;s++) pl(wx-3+rnd(1.5),ry-wr-4-s*4,wx+3+rnd(1.5),ry-wr-s*4-1,.20,.6,1);
  }
  ctx.restore();
}

requestAnimationFrame(loop);
</script>
